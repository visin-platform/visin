server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Text compresses to a fraction of its size. Without this a self-hosted install, which has no CDN in front,
  # sends every script, stylesheet and config uncompressed. Images and fonts are already compressed.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Health check endpoint
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"auth-front","type":"frontend","timestamp":"$time_iso8601","version":"1.0.0","description":"Authentication frontend service"}';
  }

  # Serve index.html with no cache
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }

  # Serve static assets with long cache (assuming filenames are hashed)
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Serve config.json with no cache
  location = /config.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
