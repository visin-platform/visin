<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 536" width="800" height="536" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Visin: web apps</title>
  <desc id="desc">The app shell loads Vision, Labeling and Account at runtime with Module Federation and renders them in one page. Sign-in and Landing run on their own. Each app is labelled with the APIs it calls.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="536" fill="#ffffff"/>
  <g><!-- web app: App shell -->
    <rect x="20" y="20" width="760" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M20,36 h760" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
    <circle cx="30" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="38" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="46" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/>
    <text x="32" y="56" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">App shell</text>
    <text x="32" y="74" font-size="12" fill="#475569" text-anchor="start">The app people open. Owns the router, the one layout and the home page, and renders the three apps below in one page.</text>
    <rect x="32" y="92" width="64.5" height="18" rx="9" fill="#dbeafe"/><text x="64.2" y="104.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Auth API</text><rect x="102.49" y="92" width="71.1" height="18" rx="9" fill="#dbeafe"/><text x="138.0" y="104.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Vision API</text><rect x="179.57999999999998" y="92" width="67.8" height="18" rx="9" fill="#dbeafe"/><text x="213.5" y="104.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Label API</text><rect x="253.36999999999998" y="92" width="70.5" height="18" rx="9" fill="#dbeafe"/><text x="288.6" y="104.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Group API</text>
  </g>
  <g><path d="M140,120 L140,196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><!-- web app: Vision -->
    <rect x="20" y="196" width="240" height="116" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M20,212 h240" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
    <circle cx="30" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="38" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="46" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/>
    <text x="32" y="232" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Vision</text>
    <text x="32" y="250" font-size="12" fill="#475569" text-anchor="start">Projects, runs, metrics, prediction</text>
    <text x="32" y="265" font-size="12" fill="#475569" text-anchor="start">frames and datasets</text>
    <rect x="32" y="284" width="71.1" height="18" rx="9" fill="#dbeafe"/><text x="67.5" y="296.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Vision API</text><rect x="109.09" y="284" width="82.6" height="18" rx="9" fill="#dbeafe"/><text x="150.4" y="296.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Dataset API</text><rect x="197.73000000000002" y="284" width="40.0" height="18" rx="9" fill="#dbeafe"/><text x="217.7" y="296.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Files</text>
  </g>
  <g><path d="M400,120 L400,196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="321.3" y="141" width="157.5" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="400.0" y="156" font-size="11.5" fill="#0f172a" text-anchor="middle">loads its code at runtime</text><text x="400.0" y="170" font-size="10.5" fill="#64748b" text-anchor="middle">Module Federation</text></g>
  <g><!-- web app: Labeling -->
    <rect x="280" y="196" width="240" height="116" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M280,212 h240" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
    <circle cx="290" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="298" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="306" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/>
    <text x="292" y="232" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Labeling</text>
    <text x="292" y="250" font-size="12" fill="#475569" text-anchor="start">Labeling jobs and the</text>
    <text x="292" y="265" font-size="12" fill="#475569" text-anchor="start">annotation tools</text>
    <rect x="292" y="284" width="67.8" height="18" rx="9" fill="#dbeafe"/><text x="325.9" y="296.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Label API</text>
  </g>
  <g><path d="M660,120 L660,196" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><!-- web app: Account -->
    <rect x="540" y="196" width="240" height="116" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M540,212 h240" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
    <circle cx="550" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="558" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="566" cy="204" r="2.5" fill="#2563eb" opacity="0.6"/>
    <text x="552" y="232" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Account</text>
    <text x="552" y="250" font-size="12" fill="#475569" text-anchor="start">Profile, groups, API keys and</text>
    <text x="552" y="265" font-size="12" fill="#475569" text-anchor="start">assistant connections</text>
    <rect x="552" y="284" width="64.5" height="18" rx="9" fill="#dbeafe"/><text x="584.2" y="296.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Auth API</text><rect x="622.49" y="284" width="70.5" height="18" rx="9" fill="#dbeafe"/><text x="657.8" y="296.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Group API</text>
  </g>
  <text x="20" y="336" font-size="11.5" fill="#64748b">Each of these three also runs on its own address, without the shell.</text>
  <g><!-- group: On their own -->
    <rect x="20" y="366" width="760" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="34" y="386" font-size="11" font-weight="700" letter-spacing="1" fill="#64748b">ON THEIR OWN<tspan font-weight="400" letter-spacing="0">  ·  the other apps send a signed-out visitor to Sign-in</tspan></text>
  </g>
  <g><!-- web app: Sign-in -->
    <rect x="34" y="392" width="358" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M34,408 h358" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
    <circle cx="44" cy="400" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="52" cy="400" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="60" cy="400" r="2.5" fill="#2563eb" opacity="0.6"/>
    <text x="46" y="428" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Sign-in</text>
    <text x="46" y="446" font-size="12" fill="#475569" text-anchor="start">Sign-in, sign-up and the consent page an</text>
    <text x="46" y="461" font-size="12" fill="#475569" text-anchor="start">assistant asks through</text>
    <rect x="46" y="472" width="64.5" height="18" rx="9" fill="#dbeafe"/><text x="78.2" y="484.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Auth API</text><rect x="116.49" y="472" width="48.8" height="18" rx="9" fill="#dbeafe"/><text x="140.9" y="484.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Google</text>
  </g>
  <g><!-- web app: Landing -->
    <rect x="408" y="392" width="358" height="108" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M408,408 h358" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
    <circle cx="418" cy="400" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="426" cy="400" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="434" cy="400" r="2.5" fill="#2563eb" opacity="0.6"/>
    <text x="420" y="428" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Landing</text>
    <text x="420" y="446" font-size="12" fill="#475569" text-anchor="start">The public site, these docs, and the API</text>
    <text x="420" y="461" font-size="12" fill="#475569" text-anchor="start">reference's "try it"</text>
    <rect x="420" y="472" width="71.1" height="18" rx="9" fill="#dbeafe"/><text x="455.5" y="484.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Vision API</text><rect x="497.09000000000003" y="472" width="64.5" height="18" rx="9" fill="#dbeafe"/><text x="529.3" y="484.5" font-size="11" font-weight="600" fill="#1e3a8a" text-anchor="middle">Auth API</text>
  </g>
</svg>
