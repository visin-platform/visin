<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Visin: research chat</title>
  <desc id="desc">Chat-front runs as a full page or shell side panel. Chat-service stores human conversations, messages and call state in MongoDB and checks group membership and project access. The assistants are their own service: assistant-service holds Vivi's settings, the queue of questions in MongoDB and the guest bot, and its worker (the same image, started as its own program) claims the questions, runs read-only MCP tools for private assistant replies and publishes the answers. The two ask each other over internal APIs, by the shared internal token: chat asks whether a message may be put to an assistant, and the assistant service asks chat to publish an answer or change a question; they share only the database, so redeploying either never interrupts an answer being written. Findings are reviewed and saved through Vision, which in turn tells chat-service (with the internal token) when a run finishes or fails, so its owner can be notified. Optionally chat sends Web Push notifications through the browsers' push services and gives calls a STUN or TURN relay; the people on a call connect to each other directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="750" fill="#ffffff"/>
  <g><!-- web app: Chat front -->
    <rect x="20" y="20" width="360" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M20,36 h360" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
    <circle cx="30" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="38" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="46" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/>
    <text x="32" y="56" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Chat front</text>
    <text x="32" y="74" font-size="12" fill="#475569" text-anchor="start">Full page and shell side panel</text>
    <text x="32" y="89" font-size="12" fill="#475569" text-anchor="start">Private assistant, DMs, rooms and channels</text>
    
  </g>
  <g><!-- web app: Vision front -->
    <rect x="420" y="20" width="360" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <path d="M420,36 h360" stroke="#2563eb" stroke-width="1" opacity="0.5"/>
    <circle cx="430" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="438" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/><circle cx="446" cy="28" r="2.5" fill="#2563eb" opacity="0.6"/>
    <text x="432" y="56" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Vision front</text>
    <text x="432" y="74" font-size="12" fill="#475569" text-anchor="start">Analyze this run / comparison</text>
    <text x="432" y="89" font-size="12" fill="#475569" text-anchor="start">Project discussion; existing findings</text>
    
  </g>
  <g><path d="M600,110 L200,110" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="332.8" y="125" width="134.4" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="400.0" y="140" font-size="11.5" fill="#0f172a" text-anchor="middle">explicit page context</text></g>
  <g><!-- service: Chat service (API) -->
    <rect x="20" y="190" width="230" height="110" rx="10" fill="#2563eb"/>
    <text x="32" y="214" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Chat service (API)</text>
    <text x="32" y="232" font-size="12" fill="#dbeafe" text-anchor="start">Session auth, history boundaries</text>
    <text x="32" y="247" font-size="12" fill="#dbeafe" text-anchor="start">REST + SSE replay</text>
    <text x="32" y="262" font-size="12" fill="#dbeafe" text-anchor="start">Calls and Web Push</text>
  </g>
  <g><!-- data store: MongoDB -->
    <path d="M285,198 v94 a115,8 0 0 0 230,0 v-94" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <ellipse cx="400" cy="198" rx="115" ry="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="297" y="226" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">MongoDB</text>
    <text x="297" y="244" font-size="12" fill="#475569" text-anchor="start">Conversations, messages</text>
    <text x="297" y="259" font-size="12" fill="#475569" text-anchor="start">Analyst + guest jobs (the queue)</text>
  </g>
  <g><!-- service: Assistant service -->
    <rect x="550" y="190" width="230" height="110" rx="10" fill="#2563eb"/>
    <text x="562" y="214" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Assistant service</text>
    <text x="562" y="232" font-size="12" fill="#dbeafe" text-anchor="start">Settings, guest intake, the queue</text>
    <text x="562" y="247" font-size="12" fill="#dbeafe" text-anchor="start">Its worker claims and answers</text>
    <text x="562" y="262" font-size="12" fill="#dbeafe" text-anchor="start">Short-lived, project-limited keys</text>
  </g>
  <g><path d="M200,110 L200,190" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="106.4" y="145" width="147.1" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="180.0" y="160" font-size="11.5" fill="#0f172a" text-anchor="middle">HTTPS + session cookie</text></g>
  <g><path d="M120,190 L120,170 L680,170 L680,190" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="321.1" y="148" width="157.8" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="400.0" y="163" font-size="11.5" fill="#0f172a" text-anchor="middle">internal APIs, both ways</text></g>
  <g><path d="M650,190 L650,180 L150,180 L150,190" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><path d="M250,245 L285,245" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><path d="M550,245 L515,245" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><!-- service: Auth + Group -->
    <rect x="20" y="400" width="230" height="95" rx="10" fill="#2563eb"/>
    <text x="32" y="424" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Auth + Group</text>
    <text x="32" y="442" font-size="12" fill="#dbeafe" text-anchor="start">Current sessions and memberships</text>
    <text x="32" y="457" font-size="12" fill="#dbeafe" text-anchor="start">Public handle lookup</text>
  </g>
  <g><!-- service: MCP + Vision -->
    <rect x="285" y="400" width="230" height="95" rx="10" fill="#2563eb"/>
    <text x="297" y="424" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">MCP + Vision</text>
    <text x="297" y="442" font-size="12" fill="#dbeafe" text-anchor="start">Read-only project tools; idempotent finding saves</text>
    <text x="297" y="457" font-size="12" fill="#dbeafe" text-anchor="start">Announces finished runs to chat</text>
  </g>
  <g><!-- external: Assistant provider -->
    <rect x="550" y="400" width="230" height="95" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="562" y="426" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Assistant provider</text>
    <text x="562" y="444" font-size="12" fill="#475569" text-anchor="start">Analyst and guest requests only</text>
    <text x="562" y="459" font-size="12" fill="#475569" text-anchor="start">Explicit opt-in deployment setting</text>
  </g>
  <g><path d="M100,300 L100,400" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><path d="M200,300 L320,400" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><path d="M610,300 L440,400" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><path d="M690,300 L690,400" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/></g>
  <g><!-- external: Push services and call relay (optional) -->
    <rect x="20" y="525" width="760" height="95" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="32" y="551" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Push services and call relay (optional)</text>
    <text x="32" y="569" font-size="12" fill="#475569" text-anchor="start">Web Push (messages, calls, finished runs); STUN / TURN from your own coturn, Cloudflare, or none</text>
    <text x="32" y="584" font-size="12" fill="#475569" text-anchor="start">Chat and one-to-one calls work without either; calls then reach one local network</text>
  </g>
  <g><path d="M20,270 L8,270 L8,572 L20,572" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="42.9" y="498" width="174.2" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="130.0" y="513" font-size="11.5" fill="#0f172a" text-anchor="middle">Web Push; relay credentials</text></g>
<text x="20" y="660" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Conversation access does not grant project access</text>
    <text x="20" y="678" font-size="12" fill="#475569" text-anchor="start">Human messaging works without a provider. Shared AI remains disabled pending audience-aware access checks.</text>
    <text x="20" y="693" font-size="12" fill="#475569" text-anchor="start">Durable sequence IDs replay messages; polling revalidates access and falls back when SSE is unavailable.</text>
    <text x="20" y="708" font-size="12" fill="#475569" text-anchor="start">The assistant service is one image with two programs; its worker is stopped by letting its running answers finish.</text>
</svg>
