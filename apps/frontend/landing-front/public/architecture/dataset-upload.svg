<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Visin: uploading a dataset</title>
  <desc id="desc">The browser asks the dataset service for a signed URL and sends the zip straight to the file service in 64 MiB chunks. The dataset service queues a scan and, once the person maps the contents, an import; a worker reads the zip, stores each image in the file service and the items in MongoDB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="640" fill="#ffffff"/>
  <g><rect x="20" y="20" width="120" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="80" y="40" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Browser</text><text x="80" y="56" font-size="10.5" fill="#475569" text-anchor="middle">Vision app</text></g>
  <g><rect x="148" y="20" width="120" height="48" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/><text x="208" y="40" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Dataset service</text><text x="208" y="56" font-size="10.5" fill="#dbeafe" text-anchor="middle">API</text></g>
  <g><rect x="276" y="20" width="120" height="48" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/><text x="336" y="40" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Redis</text><text x="336" y="56" font-size="10.5" fill="#475569" text-anchor="middle">queue</text></g>
  <g><rect x="404" y="20" width="120" height="48" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/><text x="464" y="40" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Import worker</text><text x="464" y="56" font-size="10.5" fill="#dbeafe" text-anchor="middle">in the dataset service</text></g>
  <g><rect x="532" y="20" width="120" height="48" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/><text x="592" y="49" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">File service</text></g>
  <g><rect x="660" y="20" width="120" height="48" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/><text x="720" y="49" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">MongoDB</text></g>
  <path d="M80,68 V620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M208,68 V620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M336,68 V620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M464,68 V620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M592,68 V620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M720,68 V620" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g><path d="M84,114 H204" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-brand)"/><circle cx="96" cy="103" r="8" fill="#2563eb"/><text x="96" y="106.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="110" y="107" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">asks where to upload the zip</text></g>
  <g><path d="M212,154 H588" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="224" cy="143" r="8" fill="#64748b"/><text x="224" y="146.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="238" y="147" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">gets a signed upload URL</text></g>
  <g><path d="M84,194 H588" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-brand)"/><circle cx="96" cy="183" r="8" fill="#2563eb"/><text x="96" y="186.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="110" y="187" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">sends the zip straight here, in 64 MiB chunks</text></g>
  <g><path d="M84,234 H204" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-brand)"/><circle cx="96" cy="223" r="8" fill="#2563eb"/><text x="96" y="226.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="110" y="227" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">reports the upload done</text></g>
  <g><path d="M212,274 H588" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="224" cy="263" r="8" fill="#64748b"/><text x="224" y="266.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="238" y="267" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">checks the bytes arrived</text></g>
  <g><path d="M212,314 H332" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="224" cy="303" r="8" fill="#64748b"/><text x="224" y="306.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="238" y="307" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">queues a scan</text></g>
  <g><path d="M340,354 H460" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="352" cy="343" r="8" fill="#64748b"/><text x="352" y="346.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="366" y="347" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">scan job</text></g>
  <g><path d="M468,394 H588" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="383" r="8" fill="#64748b"/><text x="480" y="386.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="494" y="387" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">reads the zip, lists its contents</text></g>
  <g><path d="M84,434 H204" stroke="#2563eb" stroke-width="1.6" fill="none" marker-end="url(#arrow-brand)"/><circle cx="96" cy="423" r="8" fill="#2563eb"/><text x="96" y="426.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">9</text><text x="110" y="427" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">maps the folders, starts the import</text></g>
  <g><path d="M212,474 H332" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="224" cy="463" r="8" fill="#64748b"/><text x="224" y="466.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">10</text><text x="238" y="467" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">queues the import</text></g>
  <g><path d="M340,514 H460" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="352" cy="503" r="8" fill="#64748b"/><text x="352" y="506.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">11</text><text x="366" y="507" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">import job</text></g>
  <g><path d="M468,554 H588" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="543" r="8" fill="#64748b"/><text x="480" y="546.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">12</text><text x="494" y="547" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">stores each image</text></g>
  <g><path d="M468,594 H716" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><circle cx="480" cy="583" r="8" fill="#64748b"/><text x="480" y="586.5" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">13</text><text x="494" y="587" font-size="11.5" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke">stores the dataset items</text></g>
</svg>
