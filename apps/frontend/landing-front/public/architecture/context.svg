<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Visin: system context</title>
  <desc id="desc">Researchers use Visin in the browser, training scripts report runs to it with a pipeline key, and AI assistants call it over MCP. Visin can use Google for sign-in.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="800" height="470" fill="#ffffff"/>
  <g><!-- person: Researcher -->
    <rect x="20" y="20" width="240" height="72" rx="14" fill="#0f172a"/>
    <circle cx="44" cy="49" r="6" fill="none" stroke="#dbeafe" stroke-width="1.6"/>
    <path d="M34,67 a10,9 0 0 1 20,0" fill="none" stroke="#dbeafe" stroke-width="1.6"/>
    <text x="64" y="47" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Researcher</text>
    <text x="64" y="65" font-size="12" fill="#cbd5e1" text-anchor="start">Projects, datasets and labeling,</text>
    <text x="64" y="80" font-size="12" fill="#cbd5e1" text-anchor="start">in the browser</text>
  </g>
  <g><!-- person: Training script -->
    <rect x="280" y="20" width="240" height="72" rx="14" fill="#0f172a"/>
    <circle cx="304" cy="49" r="6" fill="none" stroke="#dbeafe" stroke-width="1.6"/>
    <path d="M294,67 a10,9 0 0 1 20,0" fill="none" stroke="#dbeafe" stroke-width="1.6"/>
    <text x="324" y="47" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Training script</text>
    <text x="324" y="65" font-size="12" fill="#cbd5e1" text-anchor="start">Reports epochs, results and</text>
    <text x="324" y="80" font-size="12" fill="#cbd5e1" text-anchor="start">frames through visin-py</text>
  </g>
  <g><!-- person: AI assistant -->
    <rect x="540" y="20" width="240" height="72" rx="14" fill="#0f172a"/>
    <circle cx="564" cy="49" r="6" fill="none" stroke="#dbeafe" stroke-width="1.6"/>
    <path d="M554,67 a10,9 0 0 1 20,0" fill="none" stroke="#dbeafe" stroke-width="1.6"/>
    <text x="584" y="47" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">AI assistant</text>
    <text x="584" y="65" font-size="12" fill="#cbd5e1" text-anchor="start">Claude or another MCP client,</text>
    <text x="584" y="80" font-size="12" fill="#cbd5e1" text-anchor="start">acting for a signed-in user</text>
  </g>
  <g><!-- system: Visin -->
    <rect x="20" y="200" width="760" height="100" rx="14" fill="#2563eb"/>
    <text x="400" y="239" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Visin</text>
    <text x="400" y="257" font-size="12" fill="#dbeafe" text-anchor="middle">Computer-vision platform: datasets, labeling, training runs</text>
    <text x="400" y="272" font-size="12" fill="#dbeafe" text-anchor="middle">and the metrics that come out of them. Self-hosted.</text>
  </g>
  <g><!-- external: Google -->
    <rect x="290" y="380" width="220" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text x="302" y="406" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start">Google</text>
    <text x="302" y="422" font-size="11" fill="#475569" text-anchor="start">[OpenID Connect]</text>
    <text x="302" y="439" font-size="12" fill="#475569" text-anchor="start">Sign in with Google (optional)</text>
  </g>
  <g><path d="M140,92 L140,200" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="71.1" y="129" width="137.9" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="140.0" y="144" font-size="11.5" fill="#0f172a" text-anchor="middle">works in the browser</text><text x="140.0" y="158" font-size="10.5" fill="#64748b" text-anchor="middle">HTTPS, session cookie</text></g>
  <g><path d="M400,92 L400,200" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="342.1" y="129" width="115.8" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="400.0" y="144" font-size="11.5" fill="#0f172a" text-anchor="middle">reports runs</text><text x="400.0" y="158" font-size="10.5" fill="#64748b" text-anchor="middle">HTTPS, pipeline key</text></g>
  <g><path d="M660,92 L660,200" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="612.9" y="129" width="94.1" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="660.0" y="144" font-size="11.5" fill="#0f172a" text-anchor="middle">calls tools</text><text x="660.0" y="158" font-size="10.5" fill="#64748b" text-anchor="middle">MCP, OAuth 2.1</text></g>
  <g><path d="M400,300 L400,380" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="348.6" y="330" width="102.8" height="20" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="400.0" y="345" font-size="11.5" fill="#0f172a" text-anchor="middle">verifies sign-in</text></g>
</svg>
