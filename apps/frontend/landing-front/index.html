  <body>
    <div id="root"></div>
    <!--
      The landing page renders client-side, so the initial HTML body is
      otherwise empty. Googlebot executes JS and sees the real page, but
      crawlers and link-preview bots that don't execute JS need something to read. Kept
      outside #root so React never has to clear it and users never see a flash.
      Copy mirrors src/content.ts — keep the two in step.
    -->
    <noscript>
      <h1>Visin — the workbench for your computer vision work</h1>
      <p>
        Visin keeps datasets, labeling jobs, training runs, and benchmarks in one place, so
        comparing two experiments takes a click instead of an afternoon of spreadsheets. Open
        source, MIT licensed, and run on your own machines.
      </p>
      <h2>How it works</h2>
      <ol>
        <li><strong>Organise</strong> — group images into datasets and projects with categories and per-image metadata.</li>
        <li><strong>Label</strong> — bundle images into labeling jobs and split the work across your team.</li>
        <li><strong>Train and record</strong> — push runs, per-epoch metrics and configs from your own scripts via a project-scoped API token.</li>
        <li><strong>Compare and publish</strong> — put runs, datasets and benchmarks side by side, then export as LaTeX or CSV.</li>
      </ol>
      <h2>Features</h2>
      <ul>
        <li>Datasets and projects, public or private to your group</li>
        <li>Collaborative labeling with per-worker progress</li>
        <li>Training runs with per-epoch metrics and visualisations</li>
        <li>Comparisons and benchmarks, exportable to LaTeX or CSV</li>
        <li>Groups and roles: owner, admin, member</li>
        <li>Project-scoped API tokens for training loops and CI</li>
      </ul>
      <p>
        No model zoo, no AutoML, no hosted GPUs — Visin handles the bookkeeping around your
        experiments so your training code stays yours. JavaScript is required to use the app.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
