services:
  # Frontend apps
  shell-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/visin-platform}/shell-front:${TAG:-latest}
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_FRONT_URL: ${AUTH_FRONT_URL}
      VISION_FRONT_URL: ${VISION_FRONT_URL}
      LABEL_FRONT_URL: ${LABEL_FRONT_URL}
      ACCOUNT_FRONT_URL: ${ACCOUNT_FRONT_URL}
      VISION_API_URL: ${VISION_API_URL}
      LABEL_SERVICE_URL: ${LABEL_SERVICE_URL}
    ports:
      - '3010:80'
    init: true
    networks:
      - visinnet

networks:
  visinnet:
    external: true
