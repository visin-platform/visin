server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health check endpoint
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"label-front","type":"frontend","timestamp":"$time_iso8601","version":"1.0.0","description":"Labeling frontend service"}';
  }

  # Serve index.html with no cache
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    try_files $uri =404;
  }

  # shell-front loads this app as a module-federation remote from its own
  # origin, so the entry, the chunks and config.json must be readable
  # cross-origin. The entry keeps a fixed name — it is how the shell finds the
  # current hashed chunks — so, unlike them, it must never be cached.
  location = /remoteEntry.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # Serve static assets with long cache (assuming filenames are hashed)
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # Serve config.json with no cache
  location = /config.json {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
