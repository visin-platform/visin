services:
  vision-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/visin-platform}/vision-service:${TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "4010:4010"
    environment:
      - PORT=4010
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN}
      - JWT_SECRET=${JWT_SECRET}
      - GROUP_SERVICE_URL=${GROUP_SERVICE_URL}
      - DATASET_SERVICE_URL=${DATASET_SERVICE_URL}
      # What GET /api/.well-known/visin tells a client about the rest of this deployment. Both optional: unset, they are left out.
      - PUBLIC_DATASET_API_URL=${PUBLIC_DATASET_API_URL:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-}
      - VISION_API_URL=${VISION_API_URL:-}
      # The MCP server OAuth access tokens must be minted for; unset, they are refused.
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL}
      # File Service configuration
      - FILE_SERVICE_URL=${FILE_SERVICE_URL}
      - FILE_SERVICE_INTERNAL_URL=${FILE_SERVICE_INTERNAL_URL:-}
      - FILE_SERVICE_API_KEY=${FILE_SERVICE_API_KEY}
      # Gates /internal/*, which auth-service calls when issuing a project-limited API key.
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - FILE_SERVICE_HMAC_SECRET=${FILE_SERVICE_HMAC_SECRET}
    init: true
    networks:
      - visinnet

networks:
  visinnet:
    external: true
