services:
  vision-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-toomastahves}/vision-service:${TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "4010:4010"
    environment:
      - PORT=4010
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN}
      - JWT_SECRET=${JWT_SECRET}
      # File Service configuration
      - FILE_SERVICE_URL=${FILE_SERVICE_URL}
      - FILE_SERVICE_API_KEY=${FILE_SERVICE_API_KEY}
      - FILE_SERVICE_HMAC_SECRET=${FILE_SERVICE_HMAC_SECRET}
    init: true
    networks:
      - visinnet

networks:
  visinnet:
    external: true
