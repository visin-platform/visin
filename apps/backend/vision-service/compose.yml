services:
  vision-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/vision-service:latest
    restart: unless-stopped
    ports:
      - "4010:4010"
    environment:
      - PORT=4010
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=production
      # File Service configuration
      - FILE_SERVICE_URL=${FILE_SERVICE_URL}
      - FILE_SERVICE_API_KEY=${FILE_SERVICE_API_KEY}
      - FILE_SERVICE_HMAC_SECRET=${FILE_SERVICE_HMAC_SECRET}
    init: true
    networks:
      - visinnet

networks:
  visinnet:
    external: true
