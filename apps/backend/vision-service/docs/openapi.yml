openapi: 3.1.0
info:
  title: Vision Service API
  description: |
    Training runs, their epochs and results, and what is built on them: test results, benchmarks,
    comparisons, visualizations and written findings. New here? Start with the
    [quickstart](/docs/quickstart).

    **Credentials.** A training script writes with a *project token*, which reaches its own project only.
    Tools that act as a person use a *user API key* (see the auth API). Both go in
    `Authorization: Bearer <token>`.

    **Responses.** Every path starts with `/api`. A request that works answers
    `{ "success": true, "data": … }`; one that fails answers `{ "success": false, "error": …, "message": … }`
    with the matching status.

    **Privacy.** A private project, and everything in it, is visible only to its owner and the members of
    its editor groups. Configurations are the exception: they are a shared library and stay public even when
    a private run uses one, so upload nothing confidential in them.
  version: 1.0.0
  contact:
    name: Visin Team
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:4010/api
    description: Development server
  - url: https://{host}/api
    description: Your deployment's vision-service
    variables:
      host:
        default: vision-api.example.com
        description: Public hostname of vision-service (VISION_API_URL)

tags:
  - name: Trainings
    description: Training run management and orchestration
  - name: Epochs
    description: Training epoch data and test results management
  - name: Configurations
    description: Training configuration management
  - name: Test Results
    description: Model testing and evaluation results
  - name: Visualizations
    description: Training epoch visualization management
  - name: Benchmarks
    description: Model benchmark results and performance metrics
  - name: Comparisons
    description: Training/test/benchmark comparison management
  - name: Projects
    description: Project management for organizing experiments
  - name: Findings
    description: Written conclusions about runs, by people or assistants
  - name: API Tokens
    description: API token management for programmatic access

components:
  schemas:
    Error:
      type: object
      required:
        - success
        - error
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
          description: The kind of failure
          example: NotFoundError
        message:
          type: string
          description: What went wrong, naming the field or record
          example: 'Training not found with uuid: 5f0c6a2e-1d4b-4c3a-9a53-2b7e1f0d8c11'

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
        total:
          type: integer
          example: 150
        pages:
          type: integer
          example: 3

    Training:
      type: object
      properties:
        _id:
          type: string
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        datasetId:
          type: string
        configId:
          type: string
        projectId:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        tags:
          type: array
          items:
            type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        metrics:
          type: object
          properties:
            totalTime:
              type: number
            epochCount:
              type: integer
            maxEpoch:
              type: integer
            lastEpochTimestamp:
              type: string
            cpuCost:
              type: number
            gpuCost:
              type: number
            totalCost:
              type: number

    Epoch:
      type: object
      properties:
        _id:
          type: string
        trainingId:
          type: string
        training_uuid:
          type: string
        epoch_uuid:
          type: string
        epoch:
          type: integer
        timestamp:
          type: string
          format: date-time
        results:
          type: object
          description: What the epoch reported, as sent. Conditions, classes and metrics are discovered from it.
        learning_rate:
          type: number
        epoch_time:
          type: number
          description: Seconds the epoch took
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Configuration:
      type: object
      properties:
        _id:
          type: string
        uuid:
          type: string
        name:
          type: string
        trainingId:
          type: string
        config:
          type: object
        createdAt:
          type: string
          format: date-time

    TestResult:
      type: object
      properties:
        _id:
          type: string
        testUuid:
          type: string
        epochUuid:
          type: string
        trainingUuid:
          type: string
        metrics:
          type: object
        results:
          type: object
        createdAt:
          type: string
          format: date-time

    Visualization:
      type: object
      properties:
        _id:
          type: string
        visualization_uuid:
          type: string
        epoch_uuid:
          type: string
        training_uuid:
          type: string
        type:
          type: string
        filename:
          type: string
        fileId:
          type: string
          description: file-service storage path for the file.
        signedUrl:
          type: string
        signedUrlExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Benchmark:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        model:
          type: string
        dataset:
          type: string
        metrics:
          type: object
        createdAt:
          type: string
          format: date-time

    Comparison:
      type: object
      properties:
        _id:
          type: string
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - trainings
            - tests
            - benchmarks
            - epochs
          description: What `itemIds` name
        itemIds:
          type: array
          items:
            type: string
        projectId:
          type: string
        ownerId:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        ownerId:
          type: string
        isPublic:
          type: boolean
        editorGroupIds:
          type: array
          maxItems: 100
          description: Current members of these groups can read and edit project data. Only the project owner manages grants.
          items:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApiToken:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        token:
          type: string
        projectId:
          type: string
        permissions:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    Finding:
      type: object
      required: [_id, projectId, title, body, createdAt, trainingIds, citedTrainings, authorKind, authorLabel]
      properties:
        _id: { type: string }
        projectId: { type: string }
        trainingId: { type: string }
        title: { type: string }
        body: { type: string }
        recommendations: { type: string }
        createdAt: { type: string, format: date-time }
        authorKind: { type: string, enum: [person, assistant] }
        authorLabel: { type: string }
        trainingIds: { type: array, items: { type: string } }
        citedTrainings:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              name: { type: string }
              status: { type: string }

  securitySchemes:
    BearerCredential:
      type: http
      scheme: bearer
      description: "A user API key (`vsn_live_…`) or an assistant's OAuth access token, sent as `Authorization: Bearer <key>`."
    SessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: The signed-in browser session. Not for scripts.
    ProjectToken:
      type: http
      scheme: bearer
      description: "A project token, created in the project's settings. It writes to its own project only. Sent as `Authorization: Bearer <token>`."

  # Referenced throughout `paths` — every error goes through the shared
  # errorHandler, so they all share the Error shape.
  responses:
    BadRequest:
      description: The request was rejected by validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No credential, or one that is invalid, expired or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential is valid but may not do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: The request failed; the status and message say why
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /write-capabilities:
    get:
      summary: Current browser-session write capabilities
      operationId: getCapabilities
      x-internal: true
      description: Anonymous users and project credentials receive false. Responses are not cached. Resource writes independently recheck permissions.
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: ./generated/request-schemas.json#/WriteCapabilitiesQuery/properties/kind }
        - name: ids
          in: query
          required: true
          description: One to 100 comma-separated ObjectIds
          schema: { $ref: ./generated/request-schemas.json#/WriteCapabilitiesQuery/properties/ids }
      responses:
        '200':
          description: Map of resource IDs to write permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties:
                      type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Error'

  /write-capabilities/groups:
    get:
      summary: Groups the signed-in project owner can assign
      operationId: getGroups
      x-internal: true
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      responses:
        '200':
          description: Current live group IDs and names
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /findings:
    get:
      tags: [Findings]
      summary: List visible recorded findings
      operationId: getFindings
      description: |
        Includes public projects and the authenticated user's own projects.
        Visibility and subject/citation filters apply before the limit. Results
        are ordered by createdAt descending, then _id descending to break ties.
        To continue, set before to the last row's createdAt + "_" + _id, keeping
        the same filters. Example: 2026-09-01T00:00:00.000Z_507f1f77bcf86cd799439011.
        Stop when a page has fewer than limit rows; a full final page may be
        followed by an empty page. The response data remains an array.
        The cursor still works if its row is deleted. Each page reapplies current
        visibility; this is not a snapshot. Refresh to see newly added findings
        above the cursor or findings made visible since an earlier page.
      parameters:
        - name: project
          in: query
          description: Project slug or ID; an inaccessible project returns 403.
          schema: { $ref: ./generated/request-schemas.json#/ListFindingsQuery/properties/project }
        - name: training
          in: query
          description: Matches the finding's subject training or a cited training.
          schema: { $ref: ./generated/request-schemas.json#/ListFindingsQuery/properties/training }
        - name: limit
          in: query
          schema: { $ref: ./generated/request-schemas.json#/ListFindingsQuery/properties/limit }
        - name: before
          in: query
          description: The previous page's final createdAt (UTC ISO timestamp with milliseconds), underscore, and lowercase 24-character ObjectId.
          schema: { $ref: ./generated/request-schemas.json#/ListFindingsQuery/properties/before }
      responses:
        '200':
          description: One page of visible findings, including visible cited training names.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Finding' }
        '400':
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The selected project is not visible to this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The selected project does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
    post:
      tags: [Findings]
      summary: Record a finding
      operationId: createFinding
      description: A written conclusion about one or more runs in a project. The caller must be able to edit the project.
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./generated/request-schemas.json#/CreateFindingBody
      responses:
        '201':
          description: Finding recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Finding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: The caller cannot edit this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /findings/{id}:
    get:
      tags: [Findings]
      summary: Get a finding
      operationId: getFindingById
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The finding, with the cited trainings the caller can see
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Finding' }
        '403':
          description: The finding's project is not visible to this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Error'
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
    delete:
      tags: [Findings]
      summary: Delete a finding
      operationId: deleteFinding
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Finding deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '403':
          description: The caller cannot edit this finding's project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /findings/{id}/latex:
    get:
      tags: [Findings]
      summary: Export a finding as LaTeX
      operationId: exportFinding
      description: |
        The finding as a `.tex` section with a results table of its cited runs.
        Returned as JSON rather than a file download, so the app and an assistant
        can both use it. `selectBy` names the metric that decides which epoch each
        run is reported at, and `direction` says which end of it is better.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: selectBy
          in: query
          schema: { $ref: ./generated/request-schemas.json#/ExportFindingQuery/properties/selectBy }
        - name: direction
          in: query
          schema: { $ref: ./generated/request-schemas.json#/ExportFindingQuery/properties/direction }
        - name: metrics
          in: query
          schema: { $ref: ./generated/request-schemas.json#/ExportFindingQuery/properties/metrics }
      responses:
        '200':
          description: The LaTeX source and a suggested file name
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [filename, tex]
                    properties:
                      filename: { type: string, example: augmentation-helps-at-night.tex }
                      tex: { type: string }
        '403':
          description: The finding's project is not visible to this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}

  /trainings:
    get:
      tags: [Trainings]
      summary: Get all trainings
      operationId: getTrainings
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: page
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/page }
        - name: limit
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/limit }
        - name: search
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/search }
        - name: status
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/status }
        - name: datasetId
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/datasetId }
        - name: projectId
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/projectId }
        - name: tags
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/tags }
        - name: excludeTags
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/excludeTags }
        - name: ids
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/ids }
        - name: sortBy
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/sortBy }
        - name: order
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/order }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      trainings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Training'
                      pagination:
                        $ref: '#/components/schemas/PaginationMeta'
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Trainings]
      summary: Create a new training
      operationId: createTraining
      description: |
        Start a run before posting its epochs. Send your own `uuid` to refer to the
        run by an id your script already knows; one is generated otherwise. With a
        project token the run goes into the token's project and `projectId` is ignored.
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./generated/request-schemas.json#/CreateTrainingBody
      responses:
        '201':
          description: Training created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Training'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /trainings/stats:
    get:
      tags: [Trainings]
      summary: Get training statistics
      operationId: getTrainingStats
      description: |
        Cost estimates use each project's current CPU/GPU rates. Amounts are
        grouped by currency without exchange-rate conversion. Legacy scalar cost
        fields and currency are present only when exactly one currency is priced.
        Coverage includes unpriced trainings and measured durations in seconds;
        zero rates count as priced. These are current estimates, not historical bills.
      security:
        - { ProjectToken: [] }
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totalTrainings:
                        type: integer
                      totalTime:
                        type: number
                      totalEpochs:
                        type: integer
                      avgEpochTime:
                        type: number
                      totalCpuCost:
                        type: number
                      totalGpuCost:
                        type: number
                      totalCost:
                        type: number
                      currency:
                        type: string
                        description: ISO currency code of the optional scalar costs
                      costTotalsByCurrency:
                        type: array
                        description: One subtotal per currency, sorted by currency code; empty if unpriced
                        items:
                          type: object
                          required: [currency, totalCpuCost, totalGpuCost, totalCost]
                          properties:
                            currency:
                              type: string
                              example: EUR
                            totalCpuCost:
                              type: number
                            totalGpuCost:
                              type: number
                            totalCost:
                              type: number
                      costCoverage:
                        type: object
                        required: [pricedTrainings, unpricedTrainings, pricedTime, unpricedTime]
                        properties:
                          pricedTrainings:
                            type: integer
                          unpricedTrainings:
                            type: integer
                          pricedTime:
                            type: number
                            description: Measured seconds with configured rates
                          unpricedTime:
                            type: number
                            description: Measured seconds without configured rates
                      filters:
                        type: object
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
        - name: status
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingStatsQuery/properties/status }
        - name: datasetId
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingStatsQuery/properties/datasetId }
        - name: projectId
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingStatsQuery/properties/projectId }
        - name: tags
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingStatsQuery/properties/tags }

  /trainings/tags:
    get:
      tags: [Trainings]
      summary: List the tags in use
      operationId: getTrainingTags
      description: Every tag on a training the caller can see, for filter suggestions.
      responses:
        '200':
          description: Tag names
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { type: string }
        default:
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - { ProjectToken: [] }
