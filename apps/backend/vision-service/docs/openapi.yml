  /trainings/stats:
    get:
      tags: [Trainings]
      summary: Get training statistics
      description: |
        Cost estimates use each project's current CPU/GPU rates. Amounts are
        grouped by currency without exchange-rate conversion. Legacy scalar cost
        fields and currency are present only when exactly one currency is priced.
        Coverage includes unpriced trainings and measured durations in seconds;
        zero rates count as priced. These are current estimates, not historical bills.
      security:
        - ApiToken: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      totalTrainings:
                        type: integer
                      totalTime:
                        type: number
                      totalEpochs:
                        type: integer
                      avgEpochTime:
                        type: number
                      totalCpuCost:
                        type: number
                      totalGpuCost:
                        type: number
                      totalCost:
                        type: number
                      currency:
                        type: string
                        description: ISO currency code of the optional scalar costs
                      costTotalsByCurrency:
                        type: array
                        description: One subtotal per currency, sorted by currency code; empty if unpriced
                        items:
                          type: object
                          required: [currency, totalCpuCost, totalGpuCost, totalCost]
                          properties:
                            currency:
                              type: string
                              example: EUR
                            totalCpuCost:
                              type: number
                            totalGpuCost:
                              type: number
                            totalCost:
                              type: number
                      costCoverage:
                        type: object
                        required: [pricedTrainings, unpricedTrainings, pricedTime, unpricedTime]
                        properties:
                          pricedTrainings:
                            type: integer
                          unpricedTrainings:
                            type: integer
                          pricedTime:
                            type: number
                            description: Measured seconds with configured rates
                          unpricedTime:
                            type: number
                            description: Measured seconds without configured rates
                      filters:
                        type: object

