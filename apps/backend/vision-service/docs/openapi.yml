  /analysis/upload-url:
    post:
      tags: [Analysis]
      summary: Get a signed URL for uploading a dataset archive
      description: >
        Returns a short-lived URL the client PUTs the archive to directly, plus the
        `fileId` to post back to /analysis/upload (or PUT /analysis/{id}).
      security:
        - ApiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename:
                  type: string
                mimetype:
                  type: string
                  default: application/octet-stream
      responses:
        '201':
          description: Upload URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      uploadUrl:
                        type: string
                      fileId:
                        type: string
                      expiresInMinutes:
                        type: integer

