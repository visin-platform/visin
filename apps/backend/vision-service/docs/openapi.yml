                    type: string
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: API token created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ApiToken'

  /api-tokens/{id}:
    delete:
      tags: [API Tokens]
      summary: Revoke API token
      security:
        - ApiToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API token revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'

  # Health Check
  /health:
    get:
      tags: [System]
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
