openapi: 3.1.0
info:
  title: Vision Service API
  description: |
    Training runs, their epochs and results, and what is built on them: test results, benchmarks,
    comparisons, visualizations and written findings. New here? Start with the
    [quickstart](/docs/quickstart).

    **Credentials.** Training scripts use a *pipeline key*: a personal API key limited to one project.
    Other personal API keys can reach projects their owner may access, narrowed by their scopes.
    Send either in `Authorization: Bearer <token>`.

    **Responses.** Every path starts with `/api`. A request that works answers
    `{ "success": true, "data": … }`; one that fails answers `{ "success": false, "error": …, "message": … }`
    with the matching status.

    **Privacy.** Projects default to private. A private project, its configurations and results are visible
    to its owning person or owning group’s current members, and to members of its editor groups.
    Public projects allow anonymous reads. Current group roles determine who can contribute, manage or transfer.
  version: 1.0.0
  contact:
    name: Visin Team
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:4010/api
    description: Development server
  - url: https://{host}/api
    description: Your deployment's vision-service
    variables:
      host:
        default: vision-api.example.com
        description: Public hostname of vision-service (VISION_API_URL)

tags:
  - name: Trainings
    description: Training run management and orchestration
  - name: Epochs
    description: Training epoch data and test results management
  - name: Configurations
    description: Training configuration management
  - name: Visualizations
    description: Training epoch visualization management
  - name: Benchmarks
    description: Model benchmark results and performance metrics
  - name: Comparisons
    description: Training/test/benchmark comparison management
  - name: Projects
    description: Project management for organizing experiments
  - name: Findings
    description: Written conclusions about runs, by people or assistants
  - name: Suites
    description: Immutable evaluation protocols that results are ranked on
  - name: Evaluations
    description: One checkpoint scored against one suite version, with the server's verdict on whether it can be ranked
  - name: Public leaderboards
    description: Anonymous, read-only rankings of the results a manager chose to publish
  - name: Public activity
    description: Anonymous, read-only feed of what a person or a group has done in public projects
  - name: Public catalogue
    description: Anonymous, read-only list of the public projects, as the app's Explore page shows them
  - name: API Tokens
    description: API token management for programmatic access

components:
  schemas:
    Error:
      type: object
      required:
        - success
        - error
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
          description: The kind of failure
          example: NotFoundError
        message:
          type: string
          description: What went wrong, naming the field or record
          example: 'Training not found with uuid: 5f0c6a2e-1d4b-4c3a-9a53-2b7e1f0d8c11'

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
        total:
          type: integer
          example: 150
        pages:
          type: integer
          example: 3

    Training:
      type: object
      properties:
        _id:
          type: string
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        datasetId:
          type: string
        configId:
          type: string
          description: Configuration belonging to this training’s project.
        projectId:
          type: string
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - stalled
        tags:
          type: array
          items:
            type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        metrics:
          type: object
          properties:
            totalTime:
              type: number
            epochCount:
              type: integer
            maxEpoch:
              type: integer
            lastEpochTimestamp:
              type: string
            cpuCost:
              type: number
            gpuCost:
              type: number
            totalCost:
              type: number
        lastSeenAt:
          type: string
          format: date-time
        dataset:
          type: object
          properties:
            source:
              type: string
              enum:
                - visin
                - hf
                - other
            id:
              type: string
            name:
              type: string
            revision:
              type: string
              description: The version the run used. A Hub commit for a dataset kept on the Hub, otherwise the
                zip's upload time.
            archiveRevision:
              type: string
              description: For a dataset that is on the Hub and also has a zip on Visin, the zip's upload time.
                Recorded beside the commit, so a replaced zip is visible on runs that trained on it.
        models:
          type: array
          description: Hugging Face Hub models linked to this run. Visin keeps the pointer, never the bytes.
          items:
            $ref: '#/components/schemas/ModelReference'
        notes:
          type: string
          maxLength: 5000
          description: The researcher's own commentary on the run ("this one used the relabelled night set"), apart
            from `description`, which says what the run is. Anyone who may write to the run may change it; an
            empty string removes it.
        provenance:
          $ref: '#/components/schemas/Provenance'

    Provenance:
      type: object
      description: What the run was started from, so it can be reproduced. Filled in by the pipeline's client; a
        credential in a remote URL is removed on receipt.
      properties:
        git:
          type: object
          required: [commit]
          properties:
            commit: { type: string, pattern: '^[0-9a-fA-F]{7,64}$' }
            branch: { type: string }
            dirty:
              type: boolean
              description: Uncommitted changes were present, so the commit alone does not name the code that ran.
            remote: { type: string }
        command:
          type: string
          description: The command line, with secrets redacted by the client.
        packages:
          type: object
          description: Installed package versions, by name.
          additionalProperties: { type: string }
        host:
          type: object
          properties:
            hostname: { type: string }
            platform: { type: string }
            python: { type: string }
            cuda: { type: string }

    ModelList:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelReference'

    Checkpoint:
      description: |
        Which bytes were scored. A Hub checkpoint is its repo, a full commit and optionally a file; a local one is
        the SHA-256 of the weights that were loaded, never a path.
      oneOf:
        - type: object
          required: [kind, repo, commit]
          properties:
            kind: { type: string, const: hf }
            repo: { type: string, example: acme/clftv2 }
            commit: { type: string, description: The full 40-character commit hash. }
            path: { type: string }
        - type: object
          required: [kind, sha256, label]
          properties:
            kind: { type: string, const: local }
            sha256: { type: string }
            label: { type: string }

    ValidationReason:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A stable code, listed with how to fix it in the Evaluations guide.
          example: missing-condition
        detail: { type: string, description: What it is about., example: night }

    ValidationReport:
      type: object
      required: [version, state, evidence, reasons, warnings]
      properties:
        version: { type: integer, const: 2, description: The rules that judged it. }
        evidence:
          type: string
          enum: [observed, reported, attested, none]
          description: |
            How much the evaluator reported about the run. It labels a result and never decides whether it is ranked.
            `observed`: it sent the data, the protocol digest and its own package and version, and each matched the
            suite. `reported`: ranked on the submitter's word, with none or only some of that evidence (what was sent
            matched). `attested`: a manager promoted an old result and vouched for it; nothing was observed, and none
            is invented. `none`: no suite. Every level is the submitter's word, never verified.
        state:
          type: string
          enum: [eligible, incomplete, incompatible, exploratory, legacy-unverified]
          description: |
            `eligible` may be ranked. `incomplete` lacks something the suite requires. `incompatible` measured
            something other than the suite measures. `exploratory` named no suite. `legacy-unverified` predates suites.
        reasons:
          type: array
          items: { $ref: '#/components/schemas/ValidationReason' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ValidationReason' }
        scores:
          type: object
          description: Present when eligible. Per condition and overall, for each metric the suite names.
          properties:
            conditions: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } } }
            overall: { type: object, additionalProperties: { type: number } }

    EvaluationEvidence:
      description: |
        What was reported about the run. `observed` carries the evaluator's own evidence, which the suite is compared
        against; `attested` records the manager who promoted an old result and the checkpoint and counts they
        supplied. A promoted result never carries observed fields, because none were observed.
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, const: observed }
            data:
              type: object
              description: The data actually scored, in the shape a suite pins it.
              properties:
                kind: { type: string, enum: [visin, hf, external] }
                archiveSha256: { type: string }
                repo: { type: string }
                commit: { type: string }
                manifestSha256: { type: string }
            protocolDigest: { type: string, description: The digest of the protocol file the evaluator ran. }
            evaluator:
              type: object
              properties:
                package: { type: string }
                version: { type: string }
            classes:
              type: object
              properties:
                scored: { type: array, items: { type: string } }
                ignored: { type: array, items: { type: string } }
        - type: object
          required: [kind, at, evaluationId, claims]
          properties:
            kind: { type: string, const: attested }
            by: { type: string, description: The manager who promoted it. }
            at: { type: string, format: date-time }
            evaluationId: { type: string }
            claims:
              type: object
              properties:
                checkpoint: { $ref: '#/components/schemas/Checkpoint' }
                sampleCounts: { type: object, additionalProperties: { type: integer } }

    Evaluation:
      type: object
      required: [_id, uuid, projectId, status, receivedAt, validation, createdAt]
      description: |
        What a reader may see depends on who they are. Someone in the project (who can add to it) sees everything. Anyone
        else who can read it, because it is public, sees only results a manager published, without `ownerId`, without
        who vouched for an attested result, and with only the evaluator of the run's `provenance`.
      properties:
        _id: { type: string }
        uuid: { type: string, description: "The writer's id, unique within the project." }
        projectId: { type: string }
        ownerId: { type: string, description: Who recorded it. Left out for a reader who is not in the project. }
        checkpoint: { $ref: '#/components/schemas/Checkpoint' }
        checkpointKey:
          type: string
          description: '`hf:<repo>@<commit>:<path>` or `sha256:<digest>`. Evaluations with one key are the same model.'
        source:
          type: object
          description: Where the checkpoint came from. It says nothing about which bytes were scored.
          properties:
            trainingId: { type: string }
            epochUuid: { type: string }
            epoch: { type: integer }
            evaluationId: { type: string, description: 'The evaluation it was copied from, when it was promoted.' }
        run:
          type: object
          description: The run it came from, when that run is still live. Only in a list.
          properties:
            _id: { type: string }
            name: { type: string }
            uuid: { type: string }
            status: { type: string }
        epochInfo:
          type: object
          description: The epoch it was recorded at, when that epoch is still live. Only in a list.
          properties:
            epoch: { type: integer }
            epoch_time: { type: number }
        suite:
          type: object
          description: The suite version it was judged on, and that protocol's digest at the time.
          properties:
            id: { type: string }
            slug: { type: string }
            version: { type: integer }
            digest: { type: string }
        status: { type: string, enum: [completed, failed] }
        sampleCounts: { type: object, additionalProperties: { type: integer } }
        evidence: { $ref: '#/components/schemas/EvaluationEvidence' }
        executedAt: { type: string, format: date-time, description: When the writer says it ran. }
        receivedAt: { type: string, format: date-time, description: When the server stored it; this orders attempts. }
        validation: { $ref: '#/components/schemas/ValidationReport' }
        publishedAt:
          type: string
          format: date-time
          description: Present when a manager put this result on its suite's public leaderboard.
        verifiedAt: { type: string, format: date-time, description: When a manager or an automated job verified this result. Verification does not control visibility. }
        verifiedBy: { type: string, description: The verifying account; omitted for public readers. }
        hidden:
          type: object
          description: Present when a manager of the suite took it off the suite's leaderboard.
          properties:
            at: { type: string, format: date-time }
            reason: { type: string }
        supersedesId: { type: string, description: The evaluation this one corrects. It must be of the same suite and checkpoint. }
        supersededById: { type: string, description: The live correction that replaces this result. It is never ranked or published again. }
        createdAt: { type: string, format: date-time }
        results:
          type: object
          description: Only on a single evaluation. The result as sent.
          additionalProperties: true
        provenance:
          type: object
          description: Only on a single evaluation. Submitter-reported; nothing here is verified.
          additionalProperties: true

    PublicSuite:
      type: object
      description: |
        A suite as an anonymous reader sees it. A Visin dataset is reported only as `{ kind: visin }`: its id and digest
        belong to the deployment and are not shown.
      properties:
        slug: { type: string }
        version: { type: integer }
        name: { type: string }
        description: { type: string }
        digest: { type: string }
        archived: { type: boolean, const: true }
        task: { type: string }
        split: { type: string }
        data:
          type: object
          description: What the data is. `visin` carries nothing else; `hf` a repo and commit; `external` a label.
          properties:
            kind: { type: string, enum: [visin, hf, external] }
            repo: { type: string }
            commit: { type: string }
            label: { type: string }
        conditions:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              sampleCount: { type: integer }
        headline:
          type: object
          properties:
            key: { type: string }
            direction: { type: string, enum: [max, min] }
            unit: { type: string }
        aggregation: { type: string, enum: [equal-mean-of-conditions, sample-weighted-mean, pooled] }
        evaluator:
          type: object
          properties:
            package: { type: string }
            minVersion: { type: string }

    PublicCheckpoint:
      oneOf:
        - type: object
          required: [kind, repo, commit]
          properties:
            kind: { type: string, const: hf }
            repo: { type: string }
            commit: { type: string }
            path: { type: string }
        - type: object
          required: [kind, label, sha256]
          properties:
            kind: { type: string, const: local }
            label: { type: string }
            sha256: { type: string }

    PublicLeaderboard:
      type: object
      required: [suite, selection, scope, evidence, generatedAt, entries, pagination]
      properties:
        suite: { $ref: '#/components/schemas/PublicSuite' }
        selection: { type: string, const: latest-eligible-completed }
        scope:
          type: object
          description: 'The attempts behind the rows shown: every attempt of those checkpoints, published or not.'
          properties:
            candidates: { type: integer }
        evidence:
          type: string
          const: submitter-reported
          description: Evidence is reported by the submitter. Manager or job verification is recorded separately in verifiedAt.
        generatedAt: { type: string, format: date-time, description: When this response was computed. }
        pagination: { $ref: '#/components/schemas/Pagination' }
        entries:
          type: array
          items:
            type: object
            properties:
              rank: { type: integer }
              evaluationId: { type: string }
              checkpoint: { $ref: '#/components/schemas/PublicCheckpoint' }
              headline: { type: number }
              worst:
                type: object
                properties:
                  condition: { type: string }
                  value: { type: number }
              gap: { type: number }
              conditions:
                {
                  type: object,
                  additionalProperties: { type: number },
                  description: The headline metric in each condition.
                }
              attempts: { type: integer, description: 'How many results this project recorded of this checkpoint on the suite, published or not.' }
              evidenceLevel:
                { type: string, enum: [observed, reported, attested, none], description: 'Whether the evaluator sent complete evidence (observed), less (reported), or a manager vouched for an old result (attested).' }
              project: { type: object, properties: { name: { type: string }, slug: { type: string } } }
              executedAt: { type: string, format: date-time }
              publishedAt: { type: string, format: date-time }
              verifiedAt: { type: string, format: date-time }

    PublicEvaluation:
      type: object
      properties:
        evaluationId: { type: string }
        suite: { $ref: '#/components/schemas/PublicSuite' }
        checkpoint: { $ref: '#/components/schemas/PublicCheckpoint' }
        scores:
          type: object
          properties:
            conditions: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } } }
            overall: { type: object, additionalProperties: { type: number } }
        sampleCounts: { type: object, additionalProperties: { type: integer } }
        evaluator:
          type: object
          description: Only the evaluator's package, version and commit, when the submitter reported them.
          properties:
            package: { type: string }
            version: { type: string }
            commit: { type: string }
        project: { type: object, properties: { name: { type: string }, slug: { type: string } } }
        evidence: { type: string, const: submitter-reported }
        evidenceLevel:
          { type: string, enum: [observed, reported, attested, none], description: 'Whether the evaluator sent complete evidence (observed), less (reported), or a manager vouched for an old result (attested).' }
        executedAt: { type: string, format: date-time }
        publishedAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time }

    Pagination:
      type: object
      required: [page, limit, total, pages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0, description: Selected summaries across all pages. }
        pages: { type: integer, minimum: 0 }

    Leaderboard:
      type: object
      required: [suite, selection, scope, entries, unranked, pagination, unrankedPagination]
      properties:
        suite:
          type: object
          properties:
            slug: { type: string }
            version: { type: integer }
            name: { type: string }
            digest: { type: string }
            headline:
              type: object
              properties:
                key: { type: string }
                direction: { type: string, enum: [max, min] }
                unit: { type: string }
        selection:
          type: string
          const: latest-eligible-completed
          description: One evaluation per checkpoint, the latest eligible completed one by server arrival time. Never the best repeat.
        scope:
          type: object
          description: The pool that was ranked. A rank is a position within it, not among everything ever run.
          properties:
            candidates: { type: integer }
            truncated: { type: boolean, const: false, description: The complete authorized pool is always ranked. }
        pagination: { $ref: '#/components/schemas/Pagination' }
        unrankedPagination: { $ref: '#/components/schemas/Pagination' }
        entries:
          type: array
          description: Best first. Ties share a rank, and the next rank skips ("1, 2, 2, 4").
          items:
            type: object
            properties:
              evaluationId: { type: string }
              uuid: { type: string }
              rank: { type: integer }
              attempts:
                { type: integer, description: "How many evaluations of this checkpoint were recorded, of any outcome." }
              checkpointKey: { type: string }
              checkpoint: { $ref: '#/components/schemas/Checkpoint' }
              evidenceLevel:
                { type: string, enum: [observed, reported, attested, none], description: How much the evaluator reported; see `validation.evidence`. }
              project:
                { type: object, properties: { _id: { type: string }, name: { type: string }, slug: { type: string } } }
              receivedAt: { type: string, format: date-time }
              summary:
                type: object
                properties:
                  headline:
                    type: object
                    properties:
                      key: { type: string }
                      value: { type: number }
                      direction: { type: string, enum: [max, min] }
                      unit: { type: string }
                  worst:
                    type: object
                    description: The condition the headline is worst on, which for a `min` metric is its highest value.
                    properties:
                      condition: { type: string }
                      value: { type: number }
                  gap: { type: number, description: How far the worst condition falls short of the overall figure. }
        unranked:
          type: array
          description: Checkpoints with attempts but none eligible, with the latest attempt's reasons.
          items:
            type: object
            properties:
              evaluationId: { type: string }
              uuid: { type: string }
              checkpointKey: { type: string }
              state: { type: string }
              attempts: { type: integer }
              reasons: { type: array, items: { $ref: '#/components/schemas/ValidationReason' } }

    SuiteProtocol:
      type: object
      description: |
        What decides a score: the data, the conditions with their sample counts, the metrics and which way is
        better, and how the overall figure is formed. It is hashed into the suite's `digest`, so changing any
        field is a new version. The request form is `#/SuiteProtocol` in `generated/request-schemas.json`.
      additionalProperties: true

    Suite:
      type: object
      required: [_id, slug, version, name, projectId, visibility, submissions, createdBy, protocol, digest, createdAt, updatedAt]
      properties:
        _id: { type: string }
        slug: { type: string, example: clftv2-test }
        version: { type: integer, example: 1 }
        name: { type: string }
        description: { type: string }
        projectId: { type: string, description: "The project that published it, and whose access rules apply." }
        visibility:
          type: string
          enum: [private, public]
          description: '`public` lets anyone read the protocol; it grants nothing in the project.'
        submissions:
          type: string
          enum: [open, members, approval]
          description: |
            Who may publish results to its public leaderboard. `open`: a manager of any public project. `members`: only
            the project that owns the suite. `approval`: any public project; managers review unverified submissions.
            Verification is a label and does not control visibility.
        createdBy: { type: string }
        protocol: { $ref: '#/components/schemas/SuiteProtocol' }
        digest:
          type: string
          description: SHA-256 of the canonical protocol. Two suites with one digest score identically.
        archivedAt:
          type: string
          format: date-time
          description: Present once archived. New evaluations are refused; the suite and its results stay readable.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Submission:
      type: object
      description: A published result as a manager of the suite sees another project's, with only what the public sees.
      properties:
        evaluationId: { type: string }
        checkpoint: { $ref: '#/components/schemas/PublicCheckpoint' }
        project: { type: object, properties: { name: { type: string }, slug: { type: string } } }
        headline:
          type: object
          properties:
            key: { type: string }
            value: { type: number }
            unit: { type: string }
        publishedAt: { type: string, format: date-time }
        hidden:
          type: object
          properties:
            at: { type: string, format: date-time }
            reason: { type: string }

    ModelReference:
      type: object
      required: [_id, provider, kind, repo, revision, addedAt]
      properties:
        _id:
          type: string
        provider:
          type: string
          enum: [hf]
        kind:
          type: string
          enum: [model]
        repo:
          type: string
          description: The Hub repo id, `org/name`.
          example: acme/clftv2-zod
        revision:
          type: string
          pattern: ^[0-9a-f]{40}$
          description: The full commit hash the run produced. Never a branch or tag, so the link keeps naming the
            same bytes.
        path:
          type: string
          description: A file or folder inside the repo, when the model is not all of it.
        epoch:
          type: integer
          minimum: 0
          description: The epoch the checkpoint came from.
        space:
          type: string
          description: A demo Space on the Hub where anyone can try the model, `org/name`. Set with
            `PATCH /trainings/{id}/models/{modelId}`.
        addedAt:
          type: string
          format: date-time

    Epoch:
      type: object
      properties:
        _id:
          type: string
        trainingId:
          type: string
        training_uuid:
          type: string
        epoch_uuid:
          type: string
        epoch:
          type: integer
        timestamp:
          type: string
          format: date-time
        results:
          type: object
          description: What the epoch reported, as sent. Conditions, classes and metrics are discovered from it.
        learning_rate:
          type: number
        epoch_time:
          type: number
          description: Seconds the epoch took
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Configuration:
      type: object
      properties:
        _id:
          type: string
        uuid:
          type: string
        name:
          type: string
        trainingId:
          type: string
        config:
          type: object
        createdAt:
          type: string
          format: date-time

    Visualization:
      type: object
      properties:
        _id:
          type: string
        visualization_uuid:
          type: string
        epoch_uuid:
          type: string
        training_uuid:
          type: string
        type:
          type: string
        filename:
          type: string
        fileId:
          type: string
          description: file-service storage path for the file.
        signedUrl:
          type: string
        signedUrlExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Benchmark:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        model:
          type: string
        dataset:
          type: string
        metrics:
          type: object
        createdAt:
          type: string
          format: date-time
        benchmark_uuid:
          type: string

    Comparison:
      type: object
      properties:
        _id:
          type: string
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - trainings
            - tests
            - benchmarks
            - epochs
          description: What `itemIds` name
        itemIds:
          type: array
          items:
            type: string
        projectId:
          type: string
        ownerId:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicProjectCard:
      type: object
      required: [id, name, owner, createdAt, updatedAt, lastActivityAt, runs]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        owner: { $ref: '#/components/schemas/ResourceOwner' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time, description: When anything last happened in it; a project older than that field reads as its last edit }
        runs: { type: integer, minimum: 0, description: Runs in the project }
        lastRunAt: { type: string, format: date-time, description: When the latest run started; absent with no runs }
    ActivityProject:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
    ActivityItem:
      description: One line of a public activity feed. Always about a public project.
      oneOf:
        - type: object
          required: [kind, at, project]
          properties:
            kind: { type: string, const: project.created }
            at: { type: string, format: date-time }
            project: { $ref: '#/components/schemas/ActivityProject' }
        - type: object
          required: [kind, at, project, finding]
          properties:
            kind: { type: string, const: finding.posted }
            at: { type: string, format: date-time }
            project: { $ref: '#/components/schemas/ActivityProject' }
            finding:
              type: object
              required: [id, title, authorKind, authorLabel]
              properties:
                id: { type: string }
                title: { type: string }
                authorKind: { type: string, enum: [person, assistant] }
                authorLabel: { type: string }
        - type: object
          required: [kind, at, project, count]
          properties:
            kind: { type: string, const: training.run }
            at: { type: string, format: date-time, description: The latest start of that day }
            project: { $ref: '#/components/schemas/ActivityProject' }
            count: { type: integer, minimum: 1, description: Runs started that UTC day in that project }
        - type: object
          required: [kind, at, project, evaluation]
          properties:
            kind: { type: string, const: evaluation.recorded }
            at: { type: string, format: date-time }
            project: { $ref: '#/components/schemas/ActivityProject' }
            evaluation:
              type: object
              required: [id, status]
              properties:
                id: { type: string }
                status: { type: string, enum: [completed, failed] }
                suite:
                  type: object
                  required: [slug, version]
                  properties:
                    slug: { type: string }
                    version: { type: integer }

    Project:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        owner:
          $ref: '#/components/schemas/ResourceOwner'
        createdBy:
          type: string
          description: The account that created it. Attribution only; it grants nothing.
        visibility:
          type: string
          enum:
            - private
            - public
          description: "`public`: anyone can read it, signed in or not. `private`: its owner, the owning group's
            members, and editor groups."
        editorGroupIds:
          type: array
          maxItems: 100
          description: Groups the project is shared with. Their current members get `contribute`. Changing the list
            takes `manage`.
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
        trashedAt:
          type: string
          format: date-time
          description: Set while it is in the trash.
        purgeAt:
          type: string
          format: date-time
          description: In the trash listing, when it will be deleted for good.
        permissions:
          $ref: '#/components/schemas/ProjectPermissions'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stallAfterMinutes:
          type: integer
          minimum: 1
          maximum: 10080
          default: 30
        storage:
          type: object
          required: [provider]
          description: Where the project keeps its big files. Absent means `visin`. Changing it takes `manage`.
          properties:
            provider:
              type: string
              enum: [visin, hf]
              description: "`visin`: everything stays on this deployment, and a run's links to Hub models and its
                references to Hub datasets (`dataset.source: hf`) are refused with `409`. `hf`: runs may link Hugging
                Face Hub models and train on Hub datasets. A Visin dataset that is itself kept on the Hub is
                governed by the dataset, not by this setting."
            settings:
              type: object
              description: What the provider keeps about the project, validated by that provider. Replaces the whole
                setting, so leaving it out clears it.
              properties:
                namespace:
                  type: string
                  description: For `hf`, the Hub user or organisation a pipeline should create repos under by default.

    ResourceOwner:
      type: object
      required: [kind, id]
      description: A person, or a group whose members' current roles decide who may do what.
      properties:
        kind:
          type: string
          enum: [user, group]
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
          description: A group's name, when you are in it; a person's name, as they agreed to show it.
        handle:
          type: string
          description: "A person's handle, the address of their public page (/u/{handle}). Absent when they hid their profile."
        picture:
          type: string
          format: uri
          description: A person's avatar, when they have one and agreed to show it.

    ProjectPermissions:
      type: object
      description: |
        What you may do with the project. Each level includes the ones before it.
        `read`: see it. `contribute`: add runs, results and findings, and change your own
        (a group member, or an editor group). `manage`: settings, anyone's runs, the
        trash (a group admin). `own`: who can see it, transfer, restore or delete it for
        good (its owner, or the owning group's owner).
      properties:
        read: { type: boolean }
        contribute: { type: boolean }
        manage: { type: boolean }
        own: { type: boolean }

    Finding:
      type: object
      required: [_id, projectId, title, body, createdAt, trainingIds, citedTrainings, authorKind, authorLabel]
      properties:
        _id: { type: string }
        projectId: { type: string }
        trainingId: { type: string }
        title: { type: string }
        body: { type: string }
        recommendations: { type: string }
        createdAt: { type: string, format: date-time }
        authorKind: { type: string, enum: [person, assistant] }
        authorLabel: { type: string }
        trainingIds: { type: array, items: { type: string } }
        citedTrainings:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              name: { type: string }
              status: { type: string }

  securitySchemes:
    BearerCredential:
      type: http
      scheme: bearer
      description: |
        A user API key (`vsn_live_…`) or an assistant's OAuth access token, sent as `Authorization: Bearer <key>`.
        A key can be limited to one project, which is what a training pipeline uses: it then reaches only that
        project, runs it creates land there whatever project the request names, and it cannot manage projects.
    SessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: The signed-in browser session. Not for scripts.

  # Referenced throughout `paths` — every error goes through the shared
  # errorHandler, so they all share the Error shape.
  responses:
    BadRequest:
      description: The request was rejected by validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No credential, or one that is invalid, expired or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential is valid but may not do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state, for example a project whose storage does not allow it
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: The request failed; the status and message say why
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /write-capabilities:
    get:
      summary: Current browser-session write capabilities
      operationId: getCapabilities
      x-internal: true
      description: Anonymous users and project credentials receive false. Responses are not cached. Resource writes independently recheck permissions.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: ./generated/request-schemas.json#/WriteCapabilitiesQuery/properties/kind }
        - name: ids
          in: query
          required: true
          description: One to 100 comma-separated ObjectIds
          schema: { $ref: ./generated/request-schemas.json#/WriteCapabilitiesQuery/properties/ids }
      responses:
        '200':
          description: Map of resource IDs to write permission
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    additionalProperties:
                      type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/Error'

  /write-capabilities/groups:
    get:
      summary: Groups the signed-in project owner can assign
      operationId: getGroups
      x-internal: true
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      responses:
        '200':
          description: Current live group IDs and names
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /findings:
    get:
      tags: [Findings]
      summary: List visible recorded findings
      operationId: getFindings
      description: |
        Includes public projects and the authenticated user's own projects.
        Visibility and subject/citation filters apply before the limit. Results
        are ordered by createdAt descending, then _id descending to break ties.
        To continue, set before to the last row's createdAt + "_" + _id, keeping
        the same filters. Example: 2026-09-01T00:00:00.000Z_507f1f77bcf86cd799439011.
        Stop when a page has fewer than limit rows; a full final page may be
        followed by an empty page. The response data remains an array.
        The cursor still works if its row is deleted. Each page reapplies current
        visibility; this is not a snapshot. Refresh to see newly added findings
        above the cursor or findings made visible since an earlier page.
      parameters:
        - name: project
          in: query
          description: Project slug or ID; an inaccessible project returns 403.
          schema: { $ref: ./generated/request-schemas.json#/ListFindingsQuery/properties/project }
        - name: training
          in: query
          description: Matches the finding's subject training or a cited training.
          schema: { $ref: ./generated/request-schemas.json#/ListFindingsQuery/properties/training }
        - name: limit
          in: query
          schema: { $ref: ./generated/request-schemas.json#/ListFindingsQuery/properties/limit }
        - name: before
          in: query
          description: The previous page's final createdAt (UTC ISO timestamp with milliseconds), underscore, and lowercase 24-character ObjectId.
          schema: { $ref: ./generated/request-schemas.json#/ListFindingsQuery/properties/before }
      responses:
        '200':
          description: One page of visible findings, including visible cited training names.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Finding' }
        '400':
          description: Invalid limit or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The selected project is not visible to this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The selected project does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
    post:
      tags: [Findings]
      summary: Record a finding
      operationId: createFinding
      description: A written conclusion about one or more runs in a project. The caller must be able to edit the project.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./generated/request-schemas.json#/CreateFindingBody
      responses:
        '201':
          description: Finding recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Finding' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: The caller cannot edit this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /findings/{id}:
    get:
      tags: [Findings]
      summary: Get a finding
      operationId: getFindingById
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The finding, with the cited trainings the caller can see
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Finding' }
        '403':
          description: The finding's project is not visible to this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Error'
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
    delete:
      tags: [Findings]
      summary: Delete a finding
      operationId: deleteFinding
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Finding deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Success' }
        '403':
          description: The caller cannot edit this finding's project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /findings/{id}/latex:
    get:
      tags: [Findings]
      summary: Export a finding as LaTeX
      operationId: exportFinding
      description: |
        The finding as a `.tex` section with a results table of its cited runs.
        Returned as JSON rather than a file download, so the app and an assistant
        can both use it. `selectBy` names the metric that decides which epoch each
        run is reported at, and `direction` says which end of it is better.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: selectBy
          in: query
          schema: { $ref: ./generated/request-schemas.json#/ExportFindingQuery/properties/selectBy }
        - name: direction
          in: query
          schema: { $ref: ./generated/request-schemas.json#/ExportFindingQuery/properties/direction }
        - name: metrics
          in: query
          schema: { $ref: ./generated/request-schemas.json#/ExportFindingQuery/properties/metrics }
      responses:
        '200':
          description: The LaTeX source and a suggested file name
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [filename, tex]
                    properties:
                      filename: { type: string, example: augmentation-helps-at-night.tex }
                      tex: { type: string }
        '403':
          description: The finding's project is not visible to this caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': { $ref: '#/components/responses/NotFound' }
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}

  /trainings:
    get:
      tags: [Trainings]
      summary: Get all trainings
      operationId: getTrainings
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: page
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/page }
        - name: limit
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/limit }
        - name: search
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/search }
        - name: status
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/status }
        - name: datasetId
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/datasetId }
        - name: projectId
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/projectId }
        - name: access
          in: query
          description: "`contribute` keeps only runs in projects you can write to, leaving out other people's public work."
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/access }
        - name: tags
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/tags }
        - name: excludeTags
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/excludeTags }
        - name: ids
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/ids }
        - name: sortBy
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/sortBy }
        - name: order
          in: query
          schema: { $ref: ./generated/request-schemas.json#/GetTrainingsQuery/properties/order }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      trainings:
                        type: array
                        items:
                          $ref: '#/components/schemas/Training'
                      pagination:
                        $ref: '#/components/schemas/PaginationMeta'
        default:
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Trainings]
      summary: Create a new training
      operationId: createTraining
      description: |
        Start a run before posting its epochs. Send your own `uuid` to refer to the
        run by an id your script already knows; one is generated otherwise.

        Every run belongs to a project: `projectId` (its id or slug) is required, except
        with a credential limited to a project, where the run goes into that project and
        `projectId` is ignored. A project that does not exist, or that you cannot see,
        answers 404 with its name; create it under Projects first. Adding a run takes
        `contribute` on the project.

        A `dataset` with `source: hf` answers 409 unless the project's storage is set to Hugging Face.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./generated/request-schemas.json#/CreateTrainingBody
      responses:
        '201':
          description: Training created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Training'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /trainings/best:
    get:
      tags: [Trainings]
      summary: The best run of a project or a dataset
      operationId: getBestRun
      description: |
        Names the run that did best, and says by what: a run is only the best at something, so the answer carries the
        `metric` it was judged on and the direction. Pass a `projectId` for one project, or a `datasetId` for every run
        trained on that dataset in the projects the caller can see.

        The result a project is judged on is its taxonomy's `primaryMetric` (`metric.source: project`). Without one
        it is guessed: a quality score such as `val.mean_iou` from the validation block, else the validation loss
        (`metric.source: guessed`). A project whose runs report nothing that reads as a score has no best run, and
        `best` is `null`. Direction follows the taxonomy as in the training summary. Across projects whose results
        differ, the result used by most of the dataset's runs decides, since a loss and an IoU cannot be compared.

        Runs still training count, at the best epoch they have reached so far.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: projectId
          in: query
          description: A project’s id or slug
          schema: { $ref: ./generated/request-schemas.json#/BestRunQuery/properties/projectId }
        - name: datasetId
          in: query
          description: A Visin dataset id the runs were trained on
          schema: { $ref: ./generated/request-schemas.json#/BestRunQuery/properties/datasetId }
      responses:
        '200':
          description: The best run, or `null` when none can be named
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [runs, best]
                    properties:
                      runs:
                        type: integer
                        description: Runs considered
                      best:
                        type: [object, 'null']
                        properties:
                          training:
                            type: object
                            properties:
                              _id: { type: string }
                              uuid: { type: string }
                              name: { type: string }
                              status: { type: string }
                              projectId: { type: string }
                          project:
                            type: object
                            properties:
                              _id: { type: string }
                              name: { type: string }
                              slug: { type: string }
                          metric:
                            type: object
                            properties:
                              path: { type: string, example: val.mean_iou }
                              direction: { type: string, enum: [higher, lower] }
                              directionFrom: { type: string, enum: [taxonomy, default] }
                              source: { type: string, enum: [project, guessed] }
                          value: { type: number }
                          epoch: { type: integer }
        '400':
          $ref: '#/components/responses/Error'
        '403':
