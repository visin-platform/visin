  /models:
    get:
      tags: [Trainings]
      summary: Model registry
      operationId: getModels
      description: |
        Every Hugging Face Hub model linked to a run the caller may see, one row per link. This is what to open to
        answer "which model should I use": filter by project or dataset, and rank by how well each run did on a
        result of your choice.

        With `metric`, a row carries two scores that are not the same thing. `best` is where the *run* peaked on the
        result. `checkpoint` is what the epoch the link names (`model.epoch`) reported, so a checkpoint saved at epoch
        12 is not credited with the epoch-40 peak. A link that names its epoch is ranked by `checkpoint` alone, and is
        listed last when that epoch did not report the result. A link without an epoch is ranked by `best`.

        Visin does not know whether a result is better high or low, so `direction` is yours to give. A project-limited
        key sees only its own project.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: projectId
          in: query
          required: false
          description: A project id or slug.
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/projectId }
        - name: datasetId
          in: query
          required: false
          description: A Visin dataset id the run was trained on.
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/datasetId }
        - name: search
          in: query
          required: false
          description: Matches a run name or a model repo, ignoring case.
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/search }
        - name: metric
          in: query
          required: false
          description: Rank by this result, e.g. `val.mean_iou`. Adds `best` (the run's peak) and, for a link that names its epoch, `checkpoint` (that epoch's value) to each row.
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/metric }
        - name: direction
          in: query
          required: false
          description: Whether larger is better for `metric`. Use `min` for a loss or a latency.
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/direction }
        - name: sortBy
          in: query
          required: false
          description: '`addedAt` (default) or `best`, which needs `metric`. Ranks by `checkpoint` for a link that names its epoch, else by `best`. A link with no score is listed last.'
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/sortBy }
        - name: order
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/order }
        - name: page
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/page }
        - name: limit
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListModelsQuery/properties/limit }
      responses:
        '200':
          description: One page of linked models
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [models, pagination]
                    properties:
                      models:
                        type: array
                        items:
                          type: object
                          required: [model, training]
                          properties:
                            model:
                              $ref: '#/components/schemas/ModelReference'
                            training:
                              type: object
                              properties:
                                _id: { type: string }
                                uuid: { type: string }
                                name: { type: string }
                                status: { type: string }
                                projectId: { type: string }
                                datasetId: { type: string }
                                dataset:
                                  type: object
                                createdAt: { type: string, format: date-time }
                            project:
                              type: object
                              properties:
                                _id: { type: string }
                                name: { type: string }
                                slug: { type: string }
                            best:
                              type: object
                              description: Present when `metric` was given and the run reported it.
                              required: [metric, direction, value, epoch]
                              properties:
                                metric: { type: string }
                                direction: { type: string, enum: [max, min] }
                                value: { type: number }
                                epoch: { type: integer }
                            checkpoint:
                              type: object
                              description: |
                                Present when `metric` was given, the link names its epoch (`model.epoch`) and that epoch
                                reported the result. The value is that epoch's, not the run's peak.
                              required: [metric, direction, value, epoch]
                              properties:
                                metric: { type: string }
                                direction: { type: string, enum: [max, min] }
                                value: { type: number }
                                epoch: { type: integer }
                            evaluations:
                              type: array
                              description: |
                                What this checkpoint scored on suites: its latest eligible evaluation on each suite
                                version, as the suite's headline figure. The checkpoint is matched by its canonical key
                                (`hf:<repo>@<revision>:<path>`), never by model name or epoch, so a Hub link and a
                                local weights digest are different checkpoints. Only evaluations in projects the
                                caller may read count, and a credential limited to one project sees only that
                                project's. Absent when there are none.
                              items:
                                type: object
                                required: [evaluationId, suite, headline, evidence, receivedAt]
                                properties:
                                  evaluationId: { type: string }
                                  suite:
                                    type: object
                                    properties:
                                      slug: { type: string }
                                      version: { type: integer }
                                      name: { type: string }
                                  headline:
                                    type: object
                                    properties:
                                      key: { type: string }
                                      value: { type: number }
                                      unit: { type: string }
                                  evidence: { type: string, enum: [observed, reported, attested, none] }
                                  receivedAt: { type: string, format: date-time }
                      pagination:
                        $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /evaluations/leaderboard:
    get:
      tags: [Evaluations]
      summary: Rank readable recorded results, including migrated evaluations
      operationId: getRecordedLeaderboard
      description: |
        Includes completed recorded scores without a suite. Uses normal evaluation access permissions, so private
        projects remain private. Selects the latest completed live result per project, suite and checkpoint or run,
        then filters verification and ranks the selected metric. Different data remains labelled by project and run.
        Verification is a label, not a condition for inclusion. Scores with no value for the selected metric are omitted.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: page
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/RecordedLeaderboardQuery/properties/page }
        - name: limit
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/RecordedLeaderboardQuery/properties/limit }
        - name: verification
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/RecordedLeaderboardQuery/properties/verification }
        - name: metric
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/RecordedLeaderboardQuery/properties/metric }
        - name: direction
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/RecordedLeaderboardQuery/properties/direction }
        - name: projectId
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/RecordedLeaderboardQuery/properties/projectId }
      responses:
        '200':
          description: Recorded scores ranked and paginated after verification filtering
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [metrics, direction, verification, entries, pagination]
                    properties:
                      metric: { type: string }
                      metrics: { type: array, items: { type: string } }
                      direction: { type: string, enum: [max, min] }
                      verification: { type: string, enum: [all, verified, unverified] }
                      entries:
                        type: array
                        items:
                          type: object
                          required: [rank, evaluationId, project, value, verified, receivedAt]
                          properties:
                            rank: { type: integer }
                            evaluationId: { type: string }
                            checkpoint: { $ref: '#/components/schemas/Checkpoint' }
                            project:
                              type: object
                              properties:
                                id: { type: string }
                                name: { type: string }
                                slug: { type: string }
                            run:
                              type: object
                              properties:
                                id: { type: string }
                                name: { type: string }
                            dataset: { type: string }
                            epoch: { type: integer }
                            value: { type: number }
                            verified: { type: boolean }
                            receivedAt: { type: string, format: date-time }
                      pagination:
                        type: object
                        properties:
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          pages: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/{id}/verification:
    post:
      tags: [Evaluations]
      summary: Set or remove verification on a result
      operationId: verifyEvaluation
      description: |
        A manager of the result's project, or an automated job using their project-scoped API key, sets verification.
        True stamps `verifiedAt` and `verifiedBy` on the server; false clears both. Repeating the same action is harmless.
        Verification does not change the score, protocol validation or publication. Public readers see the timestamp,
        but never the account id. Needs `manage` on the project.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./generated/request-schemas.json#/VerifyEvaluationBody }
      responses:
        '200':
          description: Current verification state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [verified]
                    properties:
                      verified: { type: boolean }
                      verifiedAt: { type: string, format: date-time }
                      verifiedBy: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations:
    get:
      tags: [Evaluations]
      summary: List evaluations
      operationId: getEvaluations
      description: |
        Evaluations in the projects the caller may read, newest first. In a project the caller is part of, all of them; in a
        public project they are not part of, only the published ones, without who recorded them. Result blobs and
        provenance are left out; open one to read them, or ask for `include=results` on a small page.

        What a run reported is here too: a result recorded without a suite (a test), and one scored on a suite, both
        carry the run (`run`) and epoch (`epochInfo`) they came from when those are still live. Filter by run with
        `trainingId` or `trainingUuid`, and by epoch with `epoch` or `epochUuids`.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: page
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/page }
        - name: limit
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/limit }
        - name: projectId
          in: query
          required: false
          description: A project id or slug.
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/projectId }
        - name: suite
          in: query
          required: false
          description: Only evaluations on this suite version, as `slug@version`.
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/suite }
        - name: checkpointKey
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/checkpointKey }
        - name: state
          in: query
          required: false
          description: Only evaluations in this validation state.
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/state }
        - name: status
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/status }
        - name: trainingId
          in: query
          required: false
          description: Only what came from this run, by its id.
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/trainingId }
        - name: trainingUuid
          in: query
          required: false
          description: Only what came from the run with this uuid. A run that is gone or not visible has nothing to list.
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/trainingUuid }
        - name: epoch
          in: query
          required: false
          description: Only what was recorded at this epoch number.
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/epoch }
        - name: epochUuids
          in: query
          required: false
          description: Only what came from any of these epochs, as comma separated epoch uuids.
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/epochUuids }
        - name: sortBy
          in: query
          required: false
          description: Newest first by default; `executedAt` is when the writer says it ran, `epoch` the epoch it came from.
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/sortBy }
        - name: order
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/order }
        - name: include
          in: query
          required: false
          description: '`results` carries each evaluation''s results, which a list leaves out. Use it with a small page.'
          schema: { $ref: ./generated/request-schemas.json#/ListEvaluationsQuery/properties/include }
      responses:
        '200':
          description: One page of evaluations
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [evaluations, pagination]
                    properties:
                      evaluations:
                        type: array
                        items: { $ref: '#/components/schemas/Evaluation' }
                      pagination: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Evaluations]
      summary: Record an evaluation
      operationId: createEvaluation
      description: |
        Record one checkpoint's results, optionally against a suite version. Name the project, or leave it out and name
        the epoch the result came from (`source.epochUuid`): a run's pipeline knows its epoch, and the epoch's project is
        the run's. A result recorded without a suite (a test a run reports) is stored and shown but not ranked. The
        server judges the result and stores
        the verdict in `validation`: a well-formed result that cannot be ranked is kept, with the reasons, rather than
        refused. A malformed body, a credential in `provenance`, an unknown suite or an archived one is refused.

        Send your own `uuid`. The same result again answers `200` with the stored evaluation, so a retry after a lost
        response is safe; a different result under that uuid is `409`. To correct a result, send a new one with
        `supersedesId`, of the same suite and the same checkpoint: the corrected result is then replaced by the
        correction and leaves the ranking even when the correction cannot be ranked. One live correction at a time can
        replace a result (`409` otherwise); trashing the correction gives the original its place back. Results never
        change.

        A Hub checkpoint needs a project whose storage is Hugging Face. Needs `contribute` on the project.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./generated/request-schemas.json#/EvaluationBody }
      responses:
        '200':
          description: This result was already recorded under this uuid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/promote:
    post:
      tags: [Evaluations]
      summary: Rank a result you already have
      operationId: promoteEvaluation
      description: |
        Copy a result recorded without a suite (a test a run reported) onto one, so it can be ranked without being run
        again. The evaluation it is copied from is not changed: its results are copied as they are, and the new evaluation
        records the run, epoch and evaluation it came from, with provenance saying it was promoted.

        A result recorded without a suite carries no checkpoint identity and no sample counts, so you supply both. What you
        supply is yours to vouch for. The verdict is computed like any other, and a result that cannot be ranked is stored
        with its reasons.

        Promoting the same evaluation onto the same suite again returns the first (`200`). A different checkpoint, or
        different sample counts, for it is `409` until that evaluation is trashed; a failed evaluation, or one already
        judged on that suite, is `409` too. Needs `manage` on the evaluation's project.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./generated/request-schemas.json#/PromoteEvaluationBody }
      responses:
        '200':
          description: This evaluation was already promoted onto this suite
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '201':
          description: Promoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/{id}/publish:
    post:
      tags: [Evaluations]
      summary: Publish an evaluation to its public leaderboard
      operationId: publishEvaluation
      description: |
        Put one ranked result on the public leaderboard of its suite. Publishing is a decision about a single result: a
        public project or suite does not publish anything by existing.

        Only a ranked, completed result can be published, in a **public project** and on a **public suite**; otherwise
        `409` says which. Only the checkpoint's **latest** ranked result on the suite can be published, because a
        leaderboard shows each checkpoint by its latest result: publishing an earlier, better one would let the best of
        several attempts stand in for the model, so it is `409`. A result replaced by a correction cannot be published
        either. Recording a newer ranked result of a checkpoint withdraws its earlier published ones, and the newer one
        is published on its own. Needs `manage` on the project. The public views re-check all of it on every read, so
        withdrawing, trashing, or making the project or suite private removes the result at once. Publishing again is
        harmless. The change is recorded in the project's history.

        What becomes public is limited to a fixed set of fields. See `GET /public/evaluations/{id}`.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The evaluation, with `publishedAt` set
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/{id}/withdraw:
    post:
      tags: [Evaluations]
      summary: Take an evaluation off the public leaderboard
      operationId: withdrawEvaluation
      description: Removes it from every public list and detail at once. Withdrawing one that is not published changes nothing. Needs `manage` on the project.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The evaluation, without `publishedAt`
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/{id}/approve:
    post:
      tags: [Evaluations]
      summary: Approve a result submitted to a suite
      operationId: approveEvaluation
      description: |
        Compatibility action for a suite manager to verify a published result. Sets the same `verifiedAt` and
        `verifiedBy` fields as the verification action; it does not control visibility. Needs `manage` on the suite's
        project. An unpublished result is `409`; an already verified result answers `200`.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      approved: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/{id}/hide:
    post:
      tags: [Evaluations]
      summary: Hide a published result from a suite's leaderboard
      operationId: hideEvaluation
      description: |
        A manager of the suite's own project can take any published result off the suite's public leaderboard, whichever
        project it is from. The reason is kept with it, and the change is recorded. Its submitter can still see it and
        withdraw it, but cannot publish it again until a manager shows it. Needs `manage` on the suite's project.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./generated/request-schemas.json#/HideEvaluationBody
      responses:
        '200':
          description: Hidden (also when it already was)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      hidden: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/{id}/unhide:
    post:
      tags: [Evaluations]
      summary: Show a hidden result on its suite's leaderboard again
      operationId: unhideEvaluation
      description: Needs `manage` on the suite's project. Its publisher's decision to publish it is still in force, so it stands on the board again. Unhiding one that is not hidden changes nothing.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Shown again
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      hidden: { type: boolean, const: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /public/projects:
    get:
      tags: [Public catalogue]
      summary: List the public projects
      operationId: getPublicProjects
      description: |
        The projects anyone can open, a page at a time, as cards: owner (as far as the owner agreed to be shown), the number
        of runs and when the latest started. The same for everyone who asks, so a signed-in member's own private projects
        never mix in. Anonymous, never cached, and rate limited by client address.
      security:
        - {}
      parameters:
        - name: search
          in: query
          description: Words in the name or description.
          schema: { $ref: ./generated/request-schemas.json#/PublicProjectsQuery/properties/search }
        - name: sort
          in: query
          description: "`updated` (default): the most recent activity first (a run or epoch, a finding, a result, a change of settings). `created`: newest first."
          schema: { $ref: ./generated/request-schemas.json#/PublicProjectsQuery/properties/sort }
        - name: page
          in: query
          schema: { $ref: ./generated/request-schemas.json#/PublicProjectsQuery/properties/page }
        - name: limit
          in: query
          description: Projects per page (default 12, at most 50).
          schema: { $ref: ./generated/request-schemas.json#/PublicProjectsQuery/properties/limit }
      responses:
        '200':
          description: One page of public projects
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [projects, pagination]
                    properties:
                      projects:
                        type: array
                        items: { $ref: '#/components/schemas/PublicProjectCard' }
                      pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /public/findings:
    get:
      tags: [Public catalogue]
      summary: The latest findings in public projects
      operationId: getPublicFindings
      description: |
        Written conclusions, newest first, from public projects only, the same for everyone who asks: a member's findings in
        their own private projects are not here. Never the body, and never which account wrote one. Anonymous, never cached.
      security:
        - {}
      parameters:
        - name: limit
          in: query
          description: Findings to return (default 5, at most 20).
          schema: { $ref: ./generated/request-schemas.json#/PublicFindingsQuery/properties/limit }
      responses:
        '200':
          description: The findings
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, title, authorKind, authorLabel, createdAt, project]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        authorKind: { type: string, enum: [person, assistant] }
                        authorLabel: { type: string }
                        createdAt: { type: string, format: date-time }
                        project: { $ref: '#/components/schemas/ActivityProject' }
                        trainingId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /public/activity:
    get:
      tags: [Public activity]
      summary: What a person or a group has been doing in public
      operationId: getPublicActivity
      description: |
        Newest first: projects made, findings posted, runs started (one line per project per UTC day, not one per run) and
        results recorded. Derived on each request from what is stored rather than from a log, so it is never stale, and a
        project made private or trashed takes its whole history out of it at once. Only public projects count, whoever asks,
        and of the evaluations only what a reader of a public project is shown (its runs' tests, and what a manager
        published). Anonymous, never cached, and rate limited by client address.
      security:
        - {}
      parameters:
        - name: user
          in: query
          description: A person's account id. Give this or `owner`, not both.
          schema: { $ref: ./generated/request-schemas.json#/ActivityQuery/properties/user }
        - name: owner
          in: query
          description: "A group's id: everything in the public projects that group owns. Give this or `user`, not both."
          schema: { $ref: ./generated/request-schemas.json#/ActivityQuery/properties/owner }
        - name: limit
          in: query
          description: Lines to return (default 30, at most 100).
          schema: { $ref: ./generated/request-schemas.json#/ActivityQuery/properties/limit }
      responses:
        '200':
          description: The activity, newest first
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /public/leaderboards:
    get:
      tags: [Public leaderboards]
      summary: List the public leaderboards
      operationId: getPublicLeaderboards
      description: |
        The suites that have at least one published, ranked result, newest activity first. Anonymous, and the same for
        everyone: a credential in the request is not read. Never cached (`Cache-Control: no-store`), so a withdrawal is
        not left standing anywhere, and rate limited by client address.
      security:
        - {}
      parameters:
        - name: page
          in: query
          description: Page of selected ranked summaries (default 1).
          schema: { $ref: ./generated/request-schemas.json#/LeaderboardPageQuery/properties/page }
        - name: limit
          in: query
          description: Summaries per page (default and maximum 100).
          schema: { $ref: ./generated/request-schemas.json#/LeaderboardPageQuery/properties/limit }
      responses:
        '200':
          description: The leaderboards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      pagination: { $ref: '#/components/schemas/Pagination' }
                      leaderboards:
                        type: array
                        items:
                          allOf:
                            - { $ref: '#/components/schemas/PublicSuite' }
                            - type: object
                              properties:
                                checkpoints: { type: integer, description: How many checkpoints are ranked. }
                                lastPublishedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /public/leaderboards/{slug}/{version}:
    get:
      tags: [Public leaderboards]
      summary: Get a public leaderboard
      operationId: getPublicLeaderboard
      description: |
        The ranking of one suite version over its published results. One row per checkpoint and project, from the
        checkpoint's latest ranked attempt, never its best, and only when that very attempt is published: a newer ranked
        attempt that is not published takes the row off the board until it is. Another project's result for the same
        checkpoint is its own row. Ties share a rank; direction comes from the suite. `attempts` counts every attempt
        the project recorded, published or not. `evidence` says the results are the submitters' own claims.

        A suite that is private, absent or in a trashed project is `404`. Anonymous, never cached, rate limited.
        Selection, attempt counts and ranks use the complete authorized pool before paging the summaries.
        Ranks are global within that pool, including ties across page boundaries.
      security:
        - {}
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/PublicLeaderboardParams/properties/slug }
        - name: version
          in: path
          required: true
          description: A version number. `latest` is not accepted, so a link keeps meaning one protocol.
          schema: { $ref: ./generated/request-schemas.json#/PublicLeaderboardParams/properties/version }
        - name: page
          in: query
          description: Page of selected ranked summaries (default 1).
          schema: { $ref: ./generated/request-schemas.json#/LeaderboardQuery/properties/page }
        - name: limit
          in: query
          description: Summaries per page (default and maximum 100).
          schema: { $ref: ./generated/request-schemas.json#/LeaderboardQuery/properties/limit }
        - name: evidence
          in: query
          description: |
            `observed` ranks only the results whose evaluator reported what it observed. The pool, its counts and the
            ranks are then those of the observed results alone; promoted results are left out.
          schema: { $ref: ./generated/request-schemas.json#/LeaderboardQuery/properties/evidence }
      responses:
        '200':
          description: The ranking
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PublicLeaderboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /public/evaluations/{id}:
    get:
      tags: [Public leaderboards]
      summary: Get the evidence behind a public entry
      operationId: getPublicEvaluation
      description: |
        The scores, sample counts, checkpoint and evaluator of one published result, and nothing else: no commands,
        hosts, environment, raw configuration, run or user ids, or private dataset names. One that is not published, or
        whose project or suite is no longer public, is `404`. Published evidence remains addressable even when
        it is superseded in the ranking or falls outside the current leaderboard page.
      security:
        - {}
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The published evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PublicEvaluation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /public/badges/{slug}/{version}/{checkpointKey}.svg:
    get:
      tags: [Public leaderboards]
      summary: A badge for a published checkpoint
      operationId: getPublicBadge
      description: |
        A small SVG, such as `road-test v1 | mIoU 0.7351 · rank 2/9`, for one checkpoint published to one public
        suite version, to embed in a README or a model card. It says nothing the public leaderboard page does not,
        and it is `404` for anything that is not currently published there (a withdrawn, trashed or never published
        result, a private suite or project), whatever the reason. Anonymous, never cached, rate limited.

        Two projects can each publish the same checkpoint, so the badge names the project whose row it shows
        (`project`, its slug or id); a badge for another project's row is a different badge.

        `checkpointKey` is the canonical key, URL-encoded because it holds `:`, `@` and `/`:
        `hf:<repo>@<commit>:<path>` for a Hub checkpoint (the repo in lower case, the path empty when there is none) or
        `sha256:<digest>` for weights held elsewhere.
      security:
        - {}
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/PublicBadgeParams/properties/slug }
        - name: version
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/PublicBadgeParams/properties/version }
        - name: checkpointKey
          in: path
          required: true
          description: The checkpoint's canonical key, URL-encoded.
          schema: { $ref: ./generated/request-schemas.json#/PublicBadgeParams/properties/checkpointKey }
        - name: project
          in: query
          required: true
          description: The project whose published row the badge shows, by slug or id.
          schema: { $ref: ./generated/request-schemas.json#/PublicBadgeQuery/properties/project }
      responses:
        '200':
          description: The badge
          content:
            image/svg+xml:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/check:
    post:
      tags: [Evaluations]
      summary: Check a result without recording it
      operationId: checkEvaluation
      description: |
        Judge a result exactly as recording it would, and store nothing. Use it before an expensive upload to learn why
        a result would be unranked. It needs the same access as recording, and the same readable suite.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./generated/request-schemas.json#/EvaluationBody }
      responses:
        '200':
          description: The verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [validation]
                    properties:
                      validation: { $ref: '#/components/schemas/ValidationReport' }
                      checkpointKey: { type: string }
                      suite:
                        type: object
                        properties:
                          slug: { type: string }
                          version: { type: integer }
                          digest: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/uuid/{uuid}:
    get:
      tags: [Evaluations]
      summary: Get an evaluation by your own uuid
      operationId: getEvaluationByUuid
      description: For recovering after a lost response. A uuid is unique within a project, so the project is part of the address.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string } }
        - name: projectId
          in: query
          required: true
          description: A project id or slug.
          schema: { $ref: ./generated/request-schemas.json#/EvaluationUuidQuery/properties/projectId }
      responses:
        '200':
          description: The evaluation, with its results and provenance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/{id}:
    get:
      tags: [Evaluations]
      summary: Get an evaluation
      operationId: getEvaluation
      description: One that does not exist, is in the trash, or is in a project the caller may not read answers `404`.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The evaluation, with its results and provenance
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [Evaluations]
      summary: Move an evaluation to the trash
      operationId: trashEvaluation
      description: |
        A trashed evaluation leaves every list and leaderboard. Needs `manage`, or `contribute` for one the caller
        recorded. Bring it back with `POST /evaluations/{id}/restore`.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The trashed evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /evaluations/{id}/restore:
    post:
      tags: [Evaluations]
      summary: Restore a trashed evaluation
      operationId: restoreEvaluation
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The restored evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Evaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /suites:
    get:
      tags: [Suites]
      summary: List suites
      operationId: getSuites
      description: |
        The suites the caller may read: those of projects they can read, and public suites of live projects. Newest
        version first within a name. Archived suites are left out unless `includeArchived` is `true`.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: page
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListSuitesQuery/properties/page }
        - name: limit
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListSuitesQuery/properties/limit }
        - name: slug
          in: query
          required: false
          description: Only the versions of this suite.
          schema: { $ref: ./generated/request-schemas.json#/ListSuitesQuery/properties/slug }
        - name: projectId
          in: query
          required: false
          description: A project id or slug.
          schema: { $ref: ./generated/request-schemas.json#/ListSuitesQuery/properties/projectId }
        - name: includeArchived
          in: query
          required: false
          schema: { $ref: ./generated/request-schemas.json#/ListSuitesQuery/properties/includeArchived }
        - name: order
          in: query
          required: false
          description: Version order within a name.
          schema: { $ref: ./generated/request-schemas.json#/ListSuitesQuery/properties/order }
      responses:
        '200':
          description: One page of suites
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [suites, pagination]
                    properties:
                      suites:
                        type: array
                        items: { $ref: '#/components/schemas/Suite' }
                      pagination: { $ref: '#/components/schemas/PaginationMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [Suites]
      summary: Publish a suite version
      operationId: createSuite
      description: |
        Publish a scoring protocol. A published version never changes, so a score on `slug@version` always means
        the same thing.

        Publishing the same protocol again returns the stored suite with `200`, so a pipeline's setup script can
        run every time. A different protocol under a version that exists is `409`: publish it as the next version.
        A `slug` is one name per deployment. Ownership is reserved atomically before inserting a version, so
        concurrent publishes by different projects return `409` for the losing project even at different versions.
        The reservation survives insertion failures and project purges; only the original project may retry a failed
        insertion. Names cannot be reassigned. Existing suites acquire reservations lazily; conflicting historical
        ownership returns `409` and requires operator resolution without rewriting published protocols.

        Creating a private version needs `contribute` on the project. Creating a public version needs `manage`,
        whether `visibility: public` is explicit or inherited. The first version defaults to private; a new version
        inherits the highest existing version's visibility unless specified. A contributor can explicitly choose
        `visibility: private`; inherited public visibility otherwise returns `403`.

        Existing-version retries return the stored metadata, including visibility, without changing it or recording
        another disclosure event. Initial public creation is recorded as a visibility event.
        A key limited to one project can publish to that project only. With write scope, it may create a public suite
        there when its actor has `manage`; the key itself grants no extra sharing permission.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./generated/request-schemas.json#/CreateSuiteBody }
      responses:
        '200':
          description: This protocol was already published under this version
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Suite' }
        '201':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        default: { $ref: '#/components/responses/Error' }

  /suites/check:
    post:
      tags: [Suites]
      summary: Compute the digest of a protocol without publishing it
      operationId: checkSuite
      description: |
        The digest the server would store for this protocol, and the protocol with its defaults filled in. Nothing is
        stored. An evaluator calls this with the protocol file it is about to run and sends the digest back as
        `evidence.protocolDigest`, so the digest comes from the file actually used. The server alone canonicalizes
        (defaults filled in, keys sorted), so clients never reimplement it.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./generated/request-schemas.json#/CheckSuiteBody }
      responses:
        '200':
          description: The digest
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [digest, protocol]
                    properties:
                      digest: { type: string, description: SHA-256 of the normalized protocol. }
                      protocol: { type: object, additionalProperties: true, description: The protocol with defaults filled in. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        default: { $ref: '#/components/responses/Error' }

  /suites/{slug}/{version}/submissions:
    get:
      tags: [Suites]
      summary: Unverified and hidden results on a suite
      operationId: getSuiteSubmissions
      description: |
        For a manager of the suite's own project: published results without verification, and the ones hidden from
        its leaderboard, each with the checkpoint, the
        submitting project's name and the headline score, and nothing else of that project's records. Needs `manage` on the
        suite's project; a suite the caller cannot read is `404`.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/SuiteUpdateParams/properties/slug }
        - name: version
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/SuiteUpdateParams/properties/version }
      responses:
        '200':
          description: The two lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      suite:
                        type: object
                        properties:
                          slug: { type: string }
                          version: { type: integer }
                          submissions: { type: string, enum: [open, members, approval] }
                      pending: { type: array, items: { $ref: '#/components/schemas/Submission' } }
                      hidden: { type: array, items: { $ref: '#/components/schemas/Submission' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /suites/{slug}/{version}:
    get:
      tags: [Suites]
      summary: Get a suite version
      operationId: getSuite
      description: A suite that does not exist and one the caller may not read both answer `404`.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/SuiteParams/properties/slug }
        - name: version
          in: path
          required: true
          description: A version number, or `latest` for the highest one that is not archived.
          schema: { $ref: ./generated/request-schemas.json#/SuiteParams/properties/version }
      responses:
        '200':
          description: The suite
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [Suites]
      summary: Rename, reword, share or archive a suite
      operationId: updateSuite
      description: |
        The protocol cannot change. Archiving stops new evaluations and keeps every result readable. Needs `manage`
        on the project, or `contribute` on a suite the caller published; changing `visibility` or `submissions` needs
        `manage`. Making a suite private ends the publication of every result on it, so making it public again does not
        publish them afresh; changing `submissions` leaves what is published as it is.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/SuiteUpdateParams/properties/slug }
        - name: version
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/SuiteUpdateParams/properties/version }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ./generated/request-schemas.json#/UpdateSuiteBody }
      responses:
        '200':
          description: The updated suite
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Suite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /suites/{slug}/{version}/leaderboard:
    get:
      tags: [Suites]
      summary: Rank the evaluations of a suite version
      operationId: getSuiteLeaderboard
      description: |
        One row per checkpoint: its latest eligible completed evaluation by server arrival time, never its best
        repeat. Direction comes from the suite. Ties share a rank. Checkpoints with attempts but none eligible are
        listed under `unranked` with their reasons.

        The pool is the evaluations of this suite version in projects the caller may read, and `scope` says how many
        there were, so a rank is a position within that pool and not among everything ever run.
        Selection, attempt counts and ranks use the complete authorized pool before paging the summaries.
        Ranks are global within that pool, including ties across page boundaries.
      security:
        - { BearerCredential: [] }
        - { SessionCookie: [] }
        - {}
      parameters:
        - name: slug
          in: path
          required: true
          schema: { $ref: ./generated/request-schemas.json#/SuiteParams/properties/slug }
        - name: version
          in: path
          required: true
          description: A version number, or `latest` for the highest one that is not archived.
          schema: { $ref: ./generated/request-schemas.json#/SuiteParams/properties/version }
        - name: page
          in: query
          description: Page of selected ranked summaries (default 1).
          schema: { $ref: ./generated/request-schemas.json#/SuiteLeaderboardQuery/properties/page }
        - name: limit
          in: query
          description: Summaries per page (default and maximum 100).
          schema: { $ref: ./generated/request-schemas.json#/SuiteLeaderboardQuery/properties/limit }
        - name: evidence
          in: query
          description: |
            `observed` ranks only the results whose evaluator reported what it observed. The pool, its counts and the
            ranks are then those of the observed results alone; promoted results are left out.
          schema: { $ref: ./generated/request-schemas.json#/SuiteLeaderboardQuery/properties/evidence }
        - name: unrankedPage
          in: query
          description: Independent page of unranked checkpoints (default 1).
          schema: { $ref: ./generated/request-schemas.json#/SuiteLeaderboardQuery/properties/unrankedPage }
      responses:
        '200':
          description: The ranking
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Leaderboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /trainings/{id}/model-card:
    get:
      tags: [Trainings]
      summary: Model card for a run
      operationId: getModelCard
      description: |
        The README a Hugging Face model repo should carry, written from what Visin recorded for the run: its dataset
        and commit, the epoch reached, headline results, per-condition test results and speed. The front matter is the
        Hub's `model-index`, so the scores show on the model page; it is left out when the project's task type does
        not name a Hub task. No config values are included, since a config can hold anything.

        `visin.Run.log_model` fetches this and uploads it as `README.md` when the repo has none.
      security:
        - BearerCredential: []
        - SessionCookie: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: query
          required: false
          description: The Hub repo the card will sit in; names the card.
          schema: { $ref: ./generated/request-schemas.json#/ModelCardQuery/properties/repo }
        - name: epoch
          in: query
          required: false
          description: The epoch the checkpoint came from. The latest reported epoch when absent.
          schema: { $ref: ./generated/request-schemas.json#/ModelCardQuery/properties/epoch }
      responses:
        '200':
          description: The card, as Markdown with YAML front matter
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [readme]
                    properties:
                      readme:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /trainings/{id}/summary:
    get:
      tags: [Trainings]
      summary: How a run did, in one call
      operationId: getTrainingSummary
      description: |
        The run's state, dataset, config, linked models and provenance, and for every result it reported (the
        shallowest numeric entries of an epoch's blocks, such as `val.mean_iou`, plus any top-level result, leaving out
        per-class rows, telemetry nested below the summaries and bookkeeping like `lr`) the best epoch beside the last. A run's last
        epoch is not its result, so both are given.

        "Best" follows the project's taxonomy: a metric the project marked `higher` or `lower` is read that way
        (`directionFrom: taxonomy`). Any other is guessed from its name, so a loss or a latency is lower-is-better
        and the rest higher (`directionFrom: default`); check `directionFrom` before trusting a guess. At most 60
        results are listed.
      security:
        - BearerCredential: []
        - SessionCookie: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The summary
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [training, epochCount, lastEpoch, metrics, models]
                    properties:
                      training:
                        type: object
                        properties:
                          _id: { type: string }
                          uuid: { type: string }
                          name: { type: string }
                          status: { type: string }
                          projectId: { type: string }
                          datasetId: { type: string }
                          dataset: { type: object }
                          configId: { type: string }
                          tags: { type: array, items: { type: string } }
                          startTime: { type: string, format: date-time }
                          endTime: { type: string, format: date-time }
                          lastSeenAt: { type: string, format: date-time }
                          createdAt: { type: string, format: date-time }
                      epochCount: { type: integer }
                      lastEpoch:
                        type: [integer, 'null']
                      metrics:
                        type: array
                        items:
                          type: object
                          required: [path, direction, directionFrom, best, last]
                          properties:
                            path: { type: string }
                            direction: { type: string, enum: [higher, lower] }
                            directionFrom: { type: string, enum: [taxonomy, default] }
                            best:
                              type: object
                              properties:
                                value: { type: number }
                                epoch: { type: integer }
                            last:
                              type: object
                              properties:
                                value: { type: number }
                                epoch: { type: integer }
                      models:
                        type: array
                        items:
                          $ref: '#/components/schemas/ModelReference'
                      provenance:
                        $ref: '#/components/schemas/Provenance'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /.well-known/visin:
    get:
      tags: [Discovery]
      summary: Where the rest of this deployment is, and what your credential is
      operationId: getDiscovery
      description: |
        What a client needs to set itself up from this one address: the dataset service's and the web app's public
        addresses (each left out when the deployment has not configured it), and, for the credential sent, what
        kind it is and what it can do. `visin login` uses it, so a researcher enters one address and one key.

        Open to anyone. With no credential the kind is `anonymous`; a browser session is `session`; a user API key is
        `api-key`; an API key limited to one project is `pipeline-key`, with that project. An API key's `scopes` say
        what it may do.
      security:
        - BearerCredential: []
        - SessionCookie: []
        - {}
      responses:
        '200':
          description: The deployment and the caller's credential
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [credential]
                    properties:
                      datasetApiUrl: { type: string, format: uri }
                      appUrl: { type: string, format: uri }
                      credential:
                        type: object
                        required: [kind]
                        properties:
                          kind: { type: string, enum: [anonymous, session, api-key, pipeline-key] }
                          scopes: { type: array, items: { type: string } }
                          label: { type: string }
                          project:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Error'

  /comparisons/{id}/export:
    get:
      tags: [Comparisons]
      summary: Export a comparison of trainings as a spreadsheet
      operationId: exportComparison
      description: |
        One row per run: its name, status, dataset, epochs and linked models, then for every result any of them
        reported (the shallowest numeric entries of an epoch's blocks, such as `val.mean_iou`, plus any top-level result, leaving out
        per-class rows, telemetry nested below the summaries and bookkeeping like `lr`) its best value, the epoch
        that was reached at, the last value, and which way better was read. "(assumed)" after the direction marks
        one guessed from the result's name rather than set in the project's taxonomy.

        `csv` is UTF-8 with a byte-order mark, so Excel reads accents correctly; text that a spreadsheet would
        run as a formula is made inert. `xlsx` keeps numbers as numbers. A run the caller may not read, or that has
        been deleted, is left out. Only a comparison of trainings can be exported: any other kind answers `400`.
      security:
        - BearerCredential: []
        - SessionCookie: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: '`xlsx` (the default) or `csv`.'
          schema: { $ref: ./generated/request-schemas.json#/ExportComparisonQuery/properties/format }
      responses:
        '200':
          description: The file, as an attachment
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
