services:
  file-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/visin-platform}/file-service:${TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5002:5002'
    environment:
      - PORT=5002
      # Names this service in /metrics and in traces.
      - SERVICE_NAME=file-service
      # Where spans are sent (Jaeger, http://jaeger:4318/v1/traces). Blank sends none;
      # traces are still made, so the trace id reaches the log lines.
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # Share of requests traced, 0 to 1. Blank is 0.1.
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-}
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FILE_SERVICE_API_KEY=${FILE_SERVICE_API_KEY}
      - FILE_SERVICE_HMAC_SECRET=${FILE_SERVICE_HMAC_SECRET}
      - FILE_SERVICE_URL=${FILE_SERVICE_URL}
      - FILE_SERVICE_DATA_DIR=/data
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      - file_data:/data
    init: true
    networks:
      - visinnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  file_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FILE_DATA_PATH:-./data}

networks:
  visinnet:
    external: true
