services:
  file-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/visin-platform}/file-service:${TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5002:5002'
    environment:
      - PORT=5002
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FILE_SERVICE_API_KEY=${FILE_SERVICE_API_KEY}
      - FILE_SERVICE_HMAC_SECRET=${FILE_SERVICE_HMAC_SECRET}
      - FILE_SERVICE_URL=${FILE_SERVICE_URL}
      - FILE_SERVICE_DATA_DIR=/data
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      - file_data:/data
    init: true
    networks:
      - visinnet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  file_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${FILE_DATA_PATH:-./data}

networks:
  visinnet:
    external: true
