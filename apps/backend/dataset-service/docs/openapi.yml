                      datasets:
                        type: array
                        items:
                          $ref: "#/components/schemas/Dataset"
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          pages:
                            type: integer
        "400":
          description: Request refused
          content:
            application/json:
              schema:
                type: object
