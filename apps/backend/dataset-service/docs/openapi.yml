        '200':
          description: Dataset page
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                      - datasets
                      - pagination
                    properties:
                      datasets:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dataset'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                          limit:
                            type: integer
                          total:
                            type: integer
                          pages:
                            type: integer
