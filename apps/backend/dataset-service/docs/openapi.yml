          in: query
          required: false
          description: '`public` keeps only the datasets anyone can open, so your own private ones do not mix in. What Explore lists.'
          schema:
            $ref: ./generated/request-schemas.json#/ListDatasetsQuery/properties/visibility
        - name: page
          in: query
          required: false
          schema:
