  /datasets/share/{id}:
    get:
      tags:
        - Datasets
      summary: The preview page for a link to a public dataset
      operationId: getDatasetSharePage
      x-internal: true
      description: |
        A tiny HTML page with Open Graph tags that sends a person on to the dataset in the app, for a chat or a feed to unfurl.
        What the app's Share button copies. A private, trashed, deleted or unknown dataset, and a deployment with no
        `SHELL_FRONT_URL`, all answer the same 404. Never cached.
      security:
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The preview page
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Nothing to share here
          content:
            application/json:
              schema:
