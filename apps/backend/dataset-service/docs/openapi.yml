      tags:
        - Datasets
      summary: Download Archive
      operationId: downloadArchive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signed archive download
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required:
                      - revision
                    description: |
                      How to fetch the dataset. With a Hub `source`, download it from the Hub at `source.revision`
                      and use the zip (`downloadUrl`) only as the fallback. A dataset on the Hub alone has no
                      `downloadUrl`, `filename`, `size` or `expiresAt`.
                    properties:
                      source:
                        type: object
                        required: [provider, repo, revision]
                        properties:
                          provider:
                            type: string
                            enum: [hf]
                          repo:
                            type: string
                          revision:
                            type: string
                            pattern: ^[0-9a-f]{40}$
                      downloadUrl:
                        type: string
                        format: uri
                      filename:
                        type: string
                      size:
                        type: integer
                      revision:
                        type: string
                        description: What a client that follows `source` records as the version it used - the Hub
                          commit - or, without a source, the archive's upload time.
                      archiveRevision:
                        type: string
                        format: date-time
                        description: Version of the archive addressed by `downloadUrl`. Record this one when
                          falling back to the zip.
                      expiresAt:
                        type: string
                        format: date-time
        '400':
          description: Request refused
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    const: false
                  error:
                    type: string
                  message:
                    type: string
        '401':
          description: Request refused
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
