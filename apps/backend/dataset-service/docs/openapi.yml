      summary: Public live dataset addresses for search engines
      operationId: getDatasetSitemap
      x-internal: true
      description: |
        Up to 5,000 public datasets, excluding trash and datasets being deleted. No cache; 404 without SHELL_FRONT_URL.
        The shell advertises this API endpoint in robots.txt.
      security:
        - {}
      responses:
        '200':
          description: Dataset sitemap
          content:
