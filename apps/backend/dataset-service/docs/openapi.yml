openapi: 3.1.0
info:
  title: Dataset Service API
  version: 1.0.0
  description: Dataset archives, imports and images. Public datasets allow
    anonymous reads. User API keys use dataset scopes; pipeline keys read public
    datasets and datasets belonging to their project owner.
  contact:
    name: Visin Team
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5010/api
tags:
  - name: Datasets
    description: Dataset ownership, archives and imported items
security:
  - BearerCredential: []
  - SessionCookie: []
components:
  securitySchemes:
    BearerCredential:
      type: http
      scheme: bearer
    SessionCookie:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    Dataset:
      type: object
      required:
        - _id
        - name
        - owner
        - visibility
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: object
          properties:
            kind:
              type: string
              enum:
                - user
                - group
            id:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
            name:
              type: string
              description: A group's name, when you are in it; a person's name, as they agreed to show it.
            handle:
              type: string
              description: A person's handle, the address of their public page. Absent when they hid their profile.
            picture:
              type: string
              format: uri
              description: A person's avatar, when they have one and agreed to show it.
          required:
            - kind
            - id
        visibility:
          type: string
          enum:
            - private
            - public
        source:
          type: object
          description: Set when the dataset lives on the Hugging Face Hub. Visin keeps only this pointer; the zip
            below, if any, is the local copy. Absent means the zip kept here is the dataset.
          required: [provider, repo, revision]
          properties:
            provider:
              type: string
              enum: [hf]
            repo:
              type: string
              description: The Hub repo id, `org/name`.
            revision:
              type: string
              pattern: ^[0-9a-f]{40}$
              description: The full commit hash, never a branch or tag.
        archive:
          type: object
          properties:
            filename:
              type: string
            size:
              type: integer
            uploadedAt:
              type: string
              format: date-time
        imageCount:
          type: integer
        permissions:
          type: object
        groups:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
