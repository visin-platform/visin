openapi: 3.0.3
info:
  title: Group Service API
  description: API for managing user groups, memberships, and permissions
  version: 1.0.0
  contact:
    name: Visin Team
servers:
  - url: http://localhost:5006
    description: Development server
  - url: https://{host}
    description: Your deployment's group-service
    variables:
      host:
        default: group-api.example.com
        description: Public hostname of group-service (GROUP_SERVICE_URL)

tags:
  - name: Groups
    description: Group creation, retrieval, and management operations
  - name: My Groups
    description: Operations on user's own groups and group listings
  - name: Group Members
    description: Group member management and role operations
  - name: Group Membership
    description: Group membership status and checking operations
  - name: Public pages
    description: A group's public page, which its owner turns on
  - name: Health
    description: Health check and monitoring endpoints

components:
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error description"
      required:
        - success
        - message

    Group:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        name:
          type: string
          example: "Project Team Alpha"
        handle:
          type: string
          description: The address of the group's public page, /g/{handle}. Absent until its owner picks one.
          example: road-lab
        description:
          type: string
          maxLength: 280
        profilePublic:
          type: boolean
          description: Whether the group has a public page, and shows its name on what it owns to people who are not members. Off until the owner turns it on.
        createdBy:
          type: string
          description: Immutable creator account ID
          example: "507f1f77bcf86cd799439011"
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        deletedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - name
        - createdBy
        - members

    GroupMember:
      type: object
      properties:
        userId:
          type: string
          description: Immutable account ID used for authorization
        email:
          type: string
          format: email
          example: "member@example.com"
        role:
          type: string
          enum: ["owner", "admin", "member"]
          example: "member"
        joinedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00.000Z"
        lastActivity:
          type: string
          format: date-time
          nullable: true
          example: "2023-01-15T10:30:00.000Z"
      required:
        - userId
        - role
        - joinedAt

    GroupRolesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: string
            enum: ["owner", "admin", "member"]
          description: >-
            Distinct roles the user holds across all their groups. This is what
            callers gate admin-only behaviour on; the groups themselves are
            fetched from /api/groups/mine rather than carried in a token.
          example: ["owner", "member"]
      required:
        - success
        - data

    GroupsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Group'
      required:
        - success
        - data

    GroupResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Group'
      required:
        - success
        - data

    MembershipResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        isMember:
          type: boolean
          example: true
        role:
          type: string
          enum: ["owner", "admin", "member"]
          example: "member"
        joinedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00.000Z"
        lastActivity:
          type: string
          format: date-time
          nullable: true
          example: "2023-01-15T10:30:00.000Z"
      required:
        - success
        - isMember

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
          description: "Response data (varies by endpoint)"
      required:
        - success
        - message

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: ["ok", "error"]
          example: "ok"
        service:
          type: string
          example: "group-service"
        type:
          type: string
          example: "backend"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "1.0.0"
        description:
          type: string
          example: "Group collaboration service"
        dependencies:
          type: object
          properties:
            mongodb:
              type: string
              enum: ["connected", "disconnected"]
              example: "connected"
        error:
          type: string
          nullable: true
          example: null
      required:
        - status
        - service
        - type
        - timestamp
        - version
        - description
        - dependencies

    # Request schemas
    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
          example: "Project Team Alpha"
      required:
        - name

    UpdateGroupRequest:
      type: object
      description: Anything to change. The name is for an owner or an admin; the public page (handle, description, profilePublic) is the owner's alone.
      minProperties: 1
      properties:
        name:
          type: string
          example: "Updated Project Team Alpha"
        handle:
          type: string
          description: 3 to 30 lowercase letters, digits or single hyphens, and not a reserved word. Unique.
          example: road-lab
        description:
          type: string
          maxLength: 280
          description: An empty string clears it.
        profilePublic:
          type: boolean
          description: Needs a handle.
    PublicGroup:
      type: object
      description: What anyone may know of a group that turned its public page on. Never its members.
      required: [id, handle, name, createdAt]
      properties:
        id:
          type: string
        handle:
          type: string
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateInvitationRequest:
      type: object
      properties:
        role:
          type: string
          enum: [owner, admin, member]
          default: member
        userId:
          type: string
          description: Invite this account, found with the candidates search, instead of making a link.

    Candidate:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        name: { type: string, description: First and last name, when the account has them }
        email:
          type: string
          description: Masked (`m••••@taltech.ee`) unless the query was the whole address.

    MyInvitation:
      type: object
      required: [id, groupId, groupName, role, expiresAt]
      properties:
        id: { type: string }
        groupId: { type: string }
        groupName: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        invitedBy: { type: string, description: "The inviter's email, as the group knows it" }
        expiresAt: { type: string, format: date-time }
    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[0-9a-f]{64}$'

    UpdateRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum: ["owner", "admin", "member"]
          example: "admin"
      required:
        - role

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from auth service
    internalAuth:
      type: apiKey
      in: header
      name: x-internal-token
      description: Internal service token for inter-service communication

paths:
  /api/public/groups:
    get:
      tags: [Public pages]
      summary: Find groups with a public page
      description: |
        By the start of a handle or name, in any case. A group whose page is off is not found, whatever it is called, and
        nothing about its members is ever in the answer. Two characters at least. No sign-in needed.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 60
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: The groups found, by handle
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, handle, name]
                      properties:
                        id:
                          type: string
                        handle:
                          type: string
                        name:
                          type: string
                        description:
                          type: string
        '400':
          description: A query that is too short or too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/public/groups/{handle}:
    get:
      tags: [Public pages]
      summary: A group's public page
      description: |
        No sign-in needed. A group whose page is off, that was deleted, or that never existed answers the same 404.
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/PublicGroup'
        '404':
          description: No public page at this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/internal/groups/public:
    post:
      tags: [Public pages]
      summary: Names and handles for the groups that own what a service lists
      description: |
        For vision-service and dataset-service, service callers only. Groups without a public page are left out, so
        nothing is told about them, not even that they exist.
      security:
        - internalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
      responses:
        '200':
          description: The groups found
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, handle, name]
                      properties:
                        id:
                          type: string
                        handle:
                          type: string
                        name:
                          type: string
        '400':
          description: Not a list of group ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or wrong internal token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/internal/project-groups:
    post:
      tags: [Group Membership]
      summary: Resolve current groups for a verified vision-service identity
      description: >-
        Read-only service assertion using the existing JWT_SECRET. The signature is
        hex HMAC-SHA256 over JSON.stringify(["vision-project-groups", userId, issuedAt]).
        The timestamp must be within 30 seconds. This assertion cannot authenticate
        ordinary group-management requests. Only live group IDs, names and the user's role in each are returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, issuedAt, signature]
              properties:
                userId:
                  type: string
                  minLength: 1
                  maxLength: 200
                issuedAt:
                  type: integer
                  format: int64
                  description: Unix timestamp in milliseconds
                signature:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Current memberships; Cache-Control is no-store
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, role]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        role:
                          type: string
                          enum: [owner, admin, member]
        '400':
          description: Invalid request body
        '403':
          description: Invalid signature or expired assertion
  # Health check endpoint
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: |
        Returns the health status of the group service including database connectivity.
        Used for monitoring and load balancer health checks.
        This endpoint is public and does not require authentication.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # Group CRUD Endpoints
  /api/groups:
    post:
      tags: [Groups]
      summary: Create a new group
      description: |
        Creates a new group with the authenticated user as the owner.
        The creator automatically becomes the first member with 'owner' role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Bad request - missing or invalid group name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/groups/mine:
    get:
      tags: [My Groups]
      summary: List user's groups
      description: |
        Retrieves all groups where the authenticated user is a member.
        Updates the user's last activity timestamp in each group.
      responses:
        '200':
          description: Groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsResponse'
        '400':
          description: Bad request - user ID required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/groups/mine/deleted:
    get:
      tags: [My Groups]
      summary: List user's deleted groups
      description: |
        Retrieves all groups where the authenticated user is a member
        and the groups have been soft-deleted.
      responses:
        '200':
          description: Deleted groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupsResponse'
        '400':
          description: Bad request - user ID required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/groups/mine/roles:
    get:
      tags: [My Groups]
      summary: Get the distinct roles the user holds across their groups
      description: |
        Retrieves the distinct roles held by the authenticated user across every
        group they belong to. Optimized for other services — auth-service calls
        it once on the sign-in path to build the `groupRoles` JWT claim.
      responses:
        '200':
          description: Group roles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRolesResponse'
        '400':
          description: Bad request - user ID required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/groups/{id}:
    get:
      tags: [Groups]
      summary: Get group by ID
      description: |
        Retrieves a specific group by its ID.
        User must be a member of the group to access it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      responses:
        '200':
          description: Group retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '403':
          description: Forbidden - user is not a member of the group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

    patch:
      tags: [Groups]
      summary: Update group
      description: |
        Updates a group's name and public page.
        User must be an owner or admin of the group to rename it; only its owner can change the public page.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Bad request - invalid group name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The group still owns projects or datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

    delete:
      tags: [Groups]
      summary: Soft delete group
      description: |
        Soft deletes a group (marks as deleted).
        User must be an owner of the group.
        Group can be restored later.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      responses:
        '204':
          description: Group deleted successfully
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  # Group Restoration Endpoints
  /api/groups/{id}/restore:
    post:
      tags: [Groups]
      summary: Restore deleted group
      description: |
        Restores a soft-deleted group.
        User must be an owner of the group.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      responses:
        '200':
          description: Group restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/groups/{id}/permanent:
    delete:
      tags: [Groups]
      summary: Permanently delete group
      description: |
        Permanently deletes a group and all its data.
        This action cannot be undone.
        User must be an owner of the group, and the group must own nothing: its projects and datasets,
        including those in the trash, are transferred or deleted first. Otherwise it answers 409, naming them.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      responses:
        '204':
          description: Group permanently deleted successfully
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  # Member Management Endpoints
  /api/groups/{id}/candidates:
    get:
      tags: [Group Members]
      summary: Find accounts to invite
      description: |
        For the group's owners and admins: accounts whose email, first name or last name starts with `q`, leaving out
        members and anyone already invited. At most 10, and 30 searches a minute per account.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 254 } }
      responses:
        '200':
          description: Matching accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
        '400': { description: Fewer than three characters }
        '403': { description: Not an owner or admin of the group }
        '404': { description: Group not found }
        '429': { description: Too many searches }
        '502': { description: auth-service could not be reached }

  /api/groups/invitations/mine:
    get:
      tags: [Group Members]
      summary: Invitations waiting for me
      description: Invitations addressed to the signed-in account that are unexpired and whose sender may still send them.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/MyInvitation' } }

  /api/groups/invitations/{invitationId}/accept:
    post:
      tags: [Group Members]
      summary: Accept an invitation addressed to me
      security:
        - bearerAuth: []
      parameters:
        - { name: invitationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Joined the group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupResponse' }
        '403': { description: The sender can no longer send this invitation }
        '404': { description: Invalid, expired, or someone else's invitation }
        '409': { description: Already a member or concurrent change }

  /api/groups/invitations/{invitationId}/decline:
    post:
      tags: [Group Members]
      summary: Decline an invitation addressed to me
      security:
        - bearerAuth: []
      parameters:
        - { name: invitationId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Declined and removed }
        '404': { description: Invalid or someone else's invitation }

  /api/groups/{id}/invitations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Group Members]
      summary: Create a single-use invitation, or invite an account
      description: |
        Owners/admins may invite members or admins; only owners may invite owners. Without `userId`, returns a link
        token to share directly. With `userId`, invites that account in the app, where it accepts or declines. Either
        expires in seven days; at most 100 pending invitations. Response is not cacheable.
      security:
        - bearerAuth: []
        - internalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created; a link's token is returned only at creation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      token: { type: string, description: A link invitation only }
                      id: { type: string, description: An account invitation only }
                      userId: { type: string, description: An account invitation only }
                      expiresAt: { type: string, format: date-time }
                      role: { type: string, enum: [owner, admin, member] }
        '403': { description: Insufficient permissions }
        '404': { description: Group not found }
        '409': { description: Already a member, already invited, concurrent change, or invitation limit reached }
    delete:
      tags: [Group Members]
      summary: Revoke all pending invitations
      security:
        - bearerAuth: []
        - internalAuth: []
      responses:
        '204': { description: Pending invitations revoked }
        '403': { description: Insufficient permissions }
        '404': { description: Group not found }
        '409': { description: Concurrent change }

  /api/groups/invitations/preview:
    post:
      tags: [Group Members]
      summary: Preview an invitation without consuming it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
      responses:
        '200':
          description: Non-cacheable groupId, name, role and expiresAt in the data envelope
        '401': { description: Sign-in required }
        '403': { description: Inviter no longer has permission }
        '404': { description: Invalid, expired, revoked, or consumed invitation }

  /api/groups/invitations/accept:
    post:
      tags: [Group Members]
      summary: Explicitly accept an invitation as the signed-in account
      description: Binds membership to req.user.id and consumes the token atomically. Email and caller-supplied account IDs do not grant authority.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
      responses:
        '200':
          description: Membership accepted; response does not contain invitation hashes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401': { description: Sign-in required }
        '403': { description: Inviter no longer has permission }
        '404': { description: Invalid, expired, revoked, or consumed invitation }
        '409': { description: Already a member or concurrent change }

  /api/groups/{id}/members/{memberId}:
    patch:
      tags: [Group Members]
      summary: Update member role
      description: |
        Updates a member's role in the group.
        User must be an owner or admin of the group.
        Cannot change the role of the group owner.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
        - name: memberId
          in: path
          required: true
          schema:
            type: string
          description: Member's immutable account ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Member role updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          description: Bad request - invalid role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - insufficient permissions or cannot change owner role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

    delete:
      tags: [Group Members]
      summary: Remove member from group
      description: |
        Removes a member from the group.
        User must be an owner or admin of the group.
        Cannot remove the group owner.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
        - name: memberId
          in: path
          required: true
          schema:
            type: string
          description: Member's immutable account ID
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '403':
          description: Forbidden - insufficient permissions or cannot remove owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/groups/{id}/activity:
    get:
      tags: [Groups]
      summary: What happened to what the group owns
      description: |
        Transfers, visibility changes, and moves to and from the trash of the projects and datasets the
        group owns or owned, newest first (up to 200). Owners and admins only. `actorEmail` names who did
        it while they are a member.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      responses:
        '200':
          description: The group's activity
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        at: { type: string, format: date-time }
                        service: { type: string }
                        resourceType: { type: string, enum: [project, dataset] }
                        resourceId: { type: string }
                        resourceName: { type: string }
                        action: { type: string, enum: [transfer, visibility, trash, restore, purge] }
                        actorId: { type: string }
                        actorEmail: { type: string }
                        from: { type: object, properties: { kind: { type: string }, id: { type: string } } }
                        to: { type: object, properties: { kind: { type: string }, id: { type: string } } }
                        visibility: { type: string }
        '403':
          description: Not an owner or admin of the group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []

  /api/groups/{id}/membership:
    get:
      tags: [Group Membership]
      summary: Check membership status
      description: |
        Checks if the authenticated user is a member of the group
        and returns their membership details.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Group ID
      responses:
        '200':
          description: Membership status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
        - internalAuth: []
