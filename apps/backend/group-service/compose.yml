services:
  group-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/visin-platform}/group-service:${TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5006:5006'
    environment:
      - PORT=5006
      # Names this service in /metrics and in traces.
      - SERVICE_NAME=group-service
      # Where spans are sent (Jaeger, http://jaeger:4318/v1/traces). Blank sends none;
      # traces are still made, so the trace id reaches the log lines.
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # Share of requests traced, 0 to 1. Blank is 0.1.
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-}
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      # The web app's address: where the preview pages for shared links send people on to. Blank: no previews.
      - SHELL_FRONT_URL=${SHELL_FRONT_URL:-}
      # This service's own address, as a browser reaches it: where group pictures are served from. Blank: no uploads.
      - GROUP_SERVICE_URL=${GROUP_SERVICE_URL:-}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - VISION_SERVICE_URL=${VISION_SERVICE_URL}
      - DATASET_SERVICE_URL=${DATASET_SERVICE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
    init: true
    networks:
      - visinnet

networks:
  visinnet:
    external: true
