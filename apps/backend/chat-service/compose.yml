services:
  chat-service:
    build: .
    image: ${REGISTRY:-ghcr.io/visin-platform}/chat-service:${TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports: ['5012:5012']
    environment:
      NODE_ENV: production
      PORT: 5012
      SERVICE_NAME: chat-service
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      GUEST_NETWORK_SECRET: ${GUEST_NETWORK_SECRET:-}
      GUEST_TRUSTED_PROXY: ${GUEST_TRUSTED_PROXY:-}
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET:-}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      GROUP_SERVICE_URL: ${GROUP_SERVICE_URL}
      VISION_SERVICE_URL: ${VISION_SERVICE_URL}
      MCP_INTERNAL_URL: ${MCP_INTERNAL_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # File sharing is enabled by default and uses the existing file-service credential.
      FILE_SERVICE_INTERNAL_URL: ${FILE_SERVICE_INTERNAL_URL:-}
      FILE_SERVICE_URL: ${FILE_SERVICE_URL:-http://file-service:5002}
      FILE_SERVICE_API_KEY: ${FILE_SERVICE_API_KEY:?Set the same FILE_SERVICE_API_KEY as file-service}
      # Optional, and chat works without any of them. See .env.example.
      CALLS_ENABLED: ${CALLS_ENABLED:-true}
      STUN_URLS: ${STUN_URLS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
    networks: [visinnet]
networks:
  visinnet:
    external: true
