services:
  mcp-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: toomastahves/mcp-service:latest
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - '5009:5009'
    environment:
      - PORT=5009
      - NODE_ENV=production
      # Verifying a presented API key is the only thing this service needs the
      # database for; every read and write goes over HTTP to vision-service.
      # It never mints a credential, so API_KEY_ENCRYPTION_SECRET is absent by
      # design — and it never verifies a user session, so JWT_SECRET is too.
      - MONGODB_URI=${MONGODB_URI}
      # The container-network address, so a tool call never leaves the host.
      # Literal rather than a deploy variable: it is a fixed name on visinnet,
      # not a per-environment secret, and one less thing to configure wrong.
      - VISION_INTERNAL_URL=http://vision-service:4010
      # The public fallback, used only if the internal name cannot be resolved.
      # Reuses the VISION_API_URL the deploy already writes, rather than asking
      # for a second variable meaning the same thing.
      - VISION_SERVICE_URL=${VISION_API_URL}
      # The canonical URL clients authenticate against, and the audience every
      # OAuth access token is bound to (RFC 8707). Must match what auth-service
      # mints for, or every token is refused here.
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL}
      # Named in the protected-resource metadata, so a client discovers where to
      # obtain a token.
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
    init: true
    networks:
      - visinnet

networks:
  visinnet:
    external: true
