        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'

