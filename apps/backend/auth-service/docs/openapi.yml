openapi: 3.0.3
info:
  title: Auth Service API
  description: API for user authentication, authorization, and profile management
  version: 1.0.0
  contact:
    name: Visin Team
servers:
  - url: http://localhost:5001
    description: Development server
  - url: https://auth-api.visin.eu
    description: Production server

tags:
  - name: Authentication
    description: User authentication operations (login, logout, token management)
  - name: Profile
    description: User profile management
  - name: Admin
    description: Administrative operations for user management
  - name: Internal
    description: Internal service operations

components:
  schemas:
    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: owner@example.com
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 200
          description: At least 10 characters; hashed with scrypt before storage.
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error description"
      required:
        - success
        - message

    User:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        email:
          type: string
          format: email
          example: "user@example.com"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        signupMethod:
          type: string
          example: "google"
          enum: ["google"]
        roles:
          type: array
          items:
            type: string
          example: ["user", "admin"]
        lastLoginAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00.000Z"
        tokenVersion:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - email
        - signupMethod

    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        email:
          type: string
          format: email
          example: "user@example.com"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        name:
          type: string
          example: "John Doe"
        picture:
          type: string
          format: uri
          example: "https://lh3.googleusercontent.com/photo.jpg"
      required:
        - id
        - email

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/UserPayload'
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - success
        - user
        - token

    UserPayload:
      type: object
      properties:
        id:
          type: string
          example: "507f1f77bcf86cd799439011"
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "John Doe"
        picture:
          type: string
          format: uri
          example: "https://lh3.googleusercontent.com/photo.jpg"
        groups:
          type: array
          items:
            type: string
          example: ["group1", "group2"]
        tokenVersion:
          type: integer
          example: 1
      required:
        - id
        - email

    VerifyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        authenticated:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/UserPayload'
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      required:
        - success
        - authenticated
        - user
        - token

    RefreshResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        groups:
          type: array
          items:
            type: string
          example: ["group1", "group2"]
      required:
        - success
        - token
        - groups

    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/UserProfile'
      required:
        - success
        - user

    UsersListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required:
        - success
        - users

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
          description: "Response data (varies by endpoint)"
      required:
        - success
        - message

    # Request schemas
    ValidateTokenRequest:
      type: object
      properties:
        idToken:
          type: string
          description: "Google OAuth ID token"
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."
      required:
        - idToken

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"

    ApproveUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
      required:
        - email

    InvalidateTokensRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
      required:
        - email

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/validate endpoint
    internalAuth:
      type: apiKey
      in: header
      name: x-internal-token
      description: Internal service token for inter-service communication

paths:
  # Password strategy (public)
  /auth/setup-status:
    get:
      tags: [Authentication]
      summary: Whether this instance still needs its first account
      description: |
        Public. Lets the sign-in page decide what to render before asking for
        credentials: a deployment with no users has no way to create one, so
        the first visitor is offered the setup form instead of a login that
        could never succeed. Also reports whether Google sign-in is configured,
        so the button can be hidden rather than rendered and failing on click.
      responses:
        '200':
          description: Status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  needsSetup:
                    type: boolean
                    description: True while the users collection is empty.
                    example: false
                  googleEnabled:
                    type: boolean
                    description: True when the server has a GOOGLE_CLIENT_ID.
                    example: true

  /auth/setup:
    post:
      tags: [Authentication]
      summary: Create the first (owner) account
      description: |
        Public, but only while no user exists. Existing installations return 409.
        The account it creates is an admin, because there is nobody who could
        promote it. A unique bootstrap marker permits only one concurrent insert.
        Signs the new owner in on success. If the insert succeeded but the response
        was interrupted, recover through normal password login with those credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: Owner created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation failed (e.g. password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Setup has already been completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register with email and password
      description: |
        Public after initial setup, and signs the new account straight in.
        Returns 409 while the installation has no users. There is no approval
        step: what a user can reach is decided by group membership and by
        whether a project is public, so a fresh account simply sees only
        public work until it is invited to a group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Initial setup is required, or an account with that email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      description: |
        Public. Returns the same session as Google sign-in: a JWT plus the
        HTTP-only `access_token` cookie. An unknown email and a wrong password
        give the same 401, so the response cannot be used to discover which
        emails have accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Incorrect email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Authentication Endpoints
  /auth/validate:
    post:
      tags: [Authentication]
      summary: Validate Google OAuth token and authenticate user
      description: |
        Validates a Google OAuth ID token and signs in the account bound to its subject.
        A Google sign-up account from before subjects were stored, without a password,
        is bound on first use. An unknown Google identity with a verified email signs
        up a new account once initial setup is complete.
        This endpoint is public and used for initial login/authentication.
        On success, returns a JWT token and sets an HTTP-only cookie.

        Returns 403 when the server has no `GOOGLE_CLIENT_ID` — Google is
        optional, and an instance may run with password sign-in only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid Google token, or an email Google has not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The email belongs to an account Google cannot enter (sign in with its password and link Google), or initial setup is incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh JWT token
      description: |
        Refreshes the JWT token with updated user groups from the group service.
        Requires a valid JWT token in the Authorization header.
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout user
      description: |
        Logs out the user by clearing the authentication cookie.
        Requires a valid JWT token.
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  /auth/verify:
    get:
      tags: [Authentication]
      summary: Verify authentication and refresh token
      description: |
        Verifies the current authentication status and refreshes the JWT token
        with the latest user groups. Requires a valid JWT token.
      responses:
        '200':
          description: Authentication verified and token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  # Profile Endpoints
  /auth/profile:
    get:
      tags: [Profile]
      summary: Get user profile
      description: |
        Retrieves the current user's profile information including
        first name, last name, and other profile data.
        Requires a valid JWT token.
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

    put:
      tags: [Profile]
      summary: Update user profile
      description: |
        Updates the current user's profile information (first name, last name).
        Requires a valid JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad request - invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  # Admin Endpoints
  /auth/admin/users:
    get:
      tags: [Admin]
      summary: List all users
      description: |
        Retrieves a list of all users in the system (limited to 200 most recent).
        Requires admin role and a valid JWT token.
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401':
          description: Unauthorized - invalid token or insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []

  # Internal Service Endpoints
  /auth/internal/invalidate-tokens:
    post:
      tags: [Internal]
      summary: Invalidate user tokens (Internal)
      description: |
        Invalidates all tokens for a user by incrementing their token version.
        This is an internal endpoint used by other services to force token refresh.
        Requires internal service authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvalidateTokensRequest'
      responses:
        '200':
          description: Tokens invalidated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User tokens invalidated successfully"
                  newTokenVersion:
                    type: integer
                    example: 2
        '400':
          description: Bad request - missing email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - internalAuth: []
