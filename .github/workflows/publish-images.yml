# Publishes every app image to GHCR, for both linux/amd64 and linux/arm64.
#
# Both architectures matter and neither is optional: arm64 is what the project's
# own deployment runs on, and amd64 is what almost every laptop and cloud VM
# needs. Publishing one architecture makes `docker compose pull` fail for the
# other with "no matching manifest", so they are built together and joined into
# a single manifest list per service. A puller then gets the right one from the
# same tag, and nothing downstream has to know which.
#
# Each architecture builds on its own native runner rather than under QEMU:
# emulating arm64 on an x64 host is several times slower and used to dominate
# the release time. The two run in parallel, so adding amd64 costs almost no
# wall clock.
#
# Authentication is the job's own GITHUB_TOKEN — scoped to this run and expiring
# with it — so no registry credential is stored in this repository.
#
# Called from release.yml with a version, it builds only the services whose
# source changed since the previous release and gives every other one the new
# version tag on its existing image. Every service therefore exists at every
# version, which is what lets a deploy name one version for the whole platform.

name: Publish images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      services:
        description: 'What to build'
        required: true
        default: 'all'
        # A dropdown, so the service names do not have to be remembered or
        # spelled right. GitHub allows only one selection, which is why there is
        # no way to name a subset: the cases that matter are one service and
        # every service, and a subset is that many runs.
        type: choice
        options:
          - all
          - auth-service
          - dataset-service
          - file-service
          - group-service
          - label-service
          - mcp-service
          - vision-service
          - landing-front
          - auth-front
          - account-front
          - label-front
          - vision-front
          - shell-front
  workflow_call:
    inputs:
      version:
        description: 'The released version to publish, without the v prefix'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.plan.outputs.services }}
      retag: ${{ steps.plan.outputs.retag }}
      previous: ${{ steps.plan.outputs.previous }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A release publishes exactly its tagged commit, and compares it with
          # the release before, so it needs the history and the tags.
          fetch-depth: 0
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.version
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: plan
        env:
          VERSION: ${{ inputs.version }}
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository_owner }}
        run: |
          ALL="auth-service dataset-service file-service group-service label-service mcp-service vision-service \
               landing-front auth-front account-front label-front vision-front shell-front"
          RETAG=""
          PREVIOUS=""

          to_json() { printf '%s\n' $1 | jq -R 'select(length > 0)' | jq -cs .; }

          if [ -n "$VERSION" ]; then
            # Called by release.yml: build what changed since the previous
            # release, carry the rest forward.
            TAG="$VERSION"
            PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "v$VERSION^" 2>/dev/null || true)
            if [ -z "$PREVIOUS" ]; then
              echo "No earlier release to compare with; building everything"
              SVCS="$ALL"
            else
              PREVIOUS="${PREVIOUS#v}"
              PLAN=$(node scripts/release-plan.mjs services "v$PREVIOUS" "v$VERSION")
              SVCS=$(echo "$PLAN" | jq -r '.changed[]')
              for s in $(echo "$PLAN" | jq -r '.unchanged[]'); do
                # A service added since the previous release has no image there to
                # carry forward, so it is built instead.
                if docker buildx imagetools inspect "$IMAGE_BASE/$s:$PREVIOUS" >/dev/null 2>&1; then
                  RETAG="$RETAG $s"
                else
                  echo "$s has no $PREVIOUS image to carry forward; building it"
                  SVCS="$SVCS $s"
                fi
              done
            fi

            echo "services=$(to_json "$SVCS")" >> "$GITHUB_OUTPUT"
            echo "retag=$(to_json "$RETAG")" >> "$GITHUB_OUTPUT"
            echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            {
              echo "### Images for $TAG"
              echo ""
              echo "- Built: \`$(to_json "$SVCS")\`"
              echo "- Carried forward from ${PREVIOUS:-—}: \`$(to_json "$RETAG")\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          REQUESTED='${{ inputs.services }}'
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ]; then
            SVCS="$ALL"
          else
            SVCS="$REQUESTED"
            # Fail loudly on a typo rather than silently building nothing.
            for s in $SVCS; do
              case " $ALL " in
                *" $s "*) ;;
                *) echo "::error::unknown service '$s'"; exit 1 ;;
              esac
            done
          fi

          # The version is never typed. A tag push carries it in the tag name;
          # a manual run takes whatever package.json says, which after a release
          # is that release. There is no way to name a version by hand, because
          # a hand-typed one produces images labelled with a version the
          # repository has no record of and nothing to check out to reproduce.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="$(node -p "require('./package.json').version")"
          fi

          echo "services=$(to_json "$SVCS")" >> "$GITHUB_OUTPUT"
          echo "retag=[]" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building [$SVCS] as tag $TAG"

  # One job per service per architecture, each on a native runner. Nothing is
  # tagged here: each job pushes an untagged image and reports only its digest,
  # because two jobs pushing the same tag would race and the loser would vanish.
  build:
    needs: setup
    # A release where every service was carried forward has nothing to build.
    if: needs.setup.outputs.services != '[]'
    strategy:
      fail-fast: false
      matrix:
        # Both axes must be real matrix keys so this is a cross product:
        # services x platforms. Putting `platform` only under `include` would
        # apply each entry to every combination in turn, the later overwriting
        # the earlier, and quietly build a single architecture.
        service: ${{ fromJSON(needs.setup.outputs.services) }}
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Named so a service's two architectures sit next to each other in the run
    # view and read as one thing being built twice, rather than as separate jobs
    # that happen to share a prefix.
    name: ${{ matrix.service }} · ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}

      - name: Resolve build context
        id: ctx
        run: |
          case "${{ matrix.service }}" in
            *-front) TIER=frontend ;;
            *)       TIER=backend ;;
          esac
          echo "dir=apps/$TIER/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./${{ steps.ctx.outputs.dir }}
          file: ./${{ steps.ctx.outputs.dir }}/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}

      # The filename is the digest with its "sha256:" prefix removed: artifact
      # upload rejects a colon, because it cannot be written to an NTFS volume.
      # The merge job puts the prefix back.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins each service's two digests into one manifest list, which is the thing
  # that actually gets a tag. Until this runs the images exist but are
  # unreachable by name.
  merge:
    needs: [setup, build]
    if: needs.setup.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.setup.outputs.services) }}
    name: ${{ matrix.service }} · manifest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-${{ matrix.service }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          # Rebuild a full reference per digest file. Built as a list rather
          # than through printf's format string, which would treat any % in the
          # image name as a directive.
          REFS=""
          for digest in *; do
            REFS="$REFS $IMAGE@sha256:$digest"
          done
          echo "merging:$REFS"
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            $REFS

      - name: Verify both architectures are present
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          # A manifest list carrying only one architecture is the failure this
          # whole workflow exists to prevent, and it is invisible until someone
          # on the missing platform tries to pull. Fail here instead.
          ARCHES=$(docker buildx imagetools inspect "$IMAGE:$TAG" --raw \
            | jq -r '.manifests[] | select(.platform.os=="linux") | .platform.architecture' \
            | sort -u | tr '\n' ' ')
          echo "$IMAGE:$TAG -> $ARCHES"
          for want in amd64 arm64; do
            case " $ARCHES " in
              *" $want "*) ;;
              *) echo "::error::$IMAGE:$TAG is missing linux/$want"; exit 1 ;;
            esac
          done

  # Services unchanged since the previous release: the new version tag goes onto
  # the image already published for that release. Nothing is rebuilt — the same
  # manifest list, both architectures included, gains a second tag.
  retag:
    needs: setup
    if: needs.setup.outputs.retag != '[]'
    runs-on: ubuntu-latest
    name: carry forward unchanged images
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the previous release's images with this version
        env:
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          SERVICES: ${{ needs.setup.outputs.retag }}
          FROM: ${{ needs.setup.outputs.previous }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          for s in $(echo "$SERVICES" | jq -r '.[]'); do
            docker buildx imagetools create --tag "$IMAGE_BASE/$s:$TAG" "$IMAGE_BASE/$s:$FROM"
            echo "$s: $FROM -> $TAG"
          done
