# One run for a whole release:
#
#   1. publish each shared library with publishable changes, and skip the rest
#   2. cut the version: bump, changelog, tag
#   3. publish the images whose source changed since the previous release, and
#      carry every other image forward to the new version without rebuilding
#
# Each stage is still its own workflow and can be run by hand; this one calls
# them in order. They used to be four separate runs because a tag pushed from a
# workflow does not start other workflows — GitHub's guard against loops — so the
# image build never followed the changelog on its own. Calling them as reusable
# workflows chains them instead.
#
# What counts as a change, for both libraries and images, is decided by
# scripts/release-plan.mjs: tests, e2e suites and Markdown do not.

name: Release

run-name: Release ${{ inputs.release-as || '(version from commits)' }}

on:
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Version (e.g. 1.7.0) or patch|minor|major. Empty derives it from the commits.'
        required: false
        type: string

# The union of what the stages need: commits and tags, the npm provenance token,
# and the container registry. A called workflow cannot hold more than its caller.
permissions:
  contents: write
  id-token: write
  packages: write

# A second release queued behind a first starts from the first one's tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.plan.outputs.libraries }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Decide what to release
        id: plan
        env:
          RELEASE_AS: ${{ inputs.release-as }}
        run: |
          LIBRARIES=$(node scripts/release-plan.mjs libs)

          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$LAST" ]; then
            SERVICES=$(node scripts/release-plan.mjs services "$LAST" HEAD | jq -c .changed)
          else
            SERVICES='["(no earlier release)"]'
          fi

          # A library release re-pins its consumers, so it always changes a service
          # too; checking both keeps the answer right before that has happened.
          # An explicit version is a request to release regardless.
          RELEASE=false
          if [ "$LIBRARIES" != "[]" ] || [ "$SERVICES" != "[]" ] || [ -n "$RELEASE_AS" ]; then
            RELEASE=true
          fi

          echo "libraries=$LIBRARIES" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo ""
            echo "- Since: \`${LAST:-nothing}\`"
            echo "- Libraries to publish: \`$LIBRARIES\`"
            echo "- Services changed so far: \`$SERVICES\`"
            if [ "$RELEASE" = "true" ]; then
              echo "- Cutting a release."
            else
              echo "- Nothing publishable changed since \`$LAST\`: no release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  libraries:
    needs: plan
    if: needs.plan.outputs.libraries != '[]'
    strategy:
      # Each publish commits re-pinned consumers to the branch; one at a time, so
      # the second starts from the first one's commit.
      max-parallel: 1
      fail-fast: true
      matrix:
        library: ${{ fromJSON(needs.plan.outputs.libraries) }}
    uses: ./.github/workflows/publish-libs.yml
    with:
      library: ${{ matrix.library }}
      release-type: auto
    secrets: inherit

  changelog:
    needs: [plan, libraries]
    # Runs after the libraries were published, or when there were none to
    # publish — never after a library publish failed.
    if: >-
      always() && needs.plan.outputs.release == 'true' &&
      (needs.libraries.result == 'success' || needs.libraries.result == 'skipped')
    uses: ./.github/workflows/changelog.yml
    with:
      release-as: ${{ inputs.release-as }}

  images:
    needs: changelog
    if: always() && needs.changelog.result == 'success'
    uses: ./.github/workflows/publish-images.yml
    with:
      version: ${{ needs.changelog.outputs.version }}
