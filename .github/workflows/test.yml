name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.set-matrix.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
            backend-shared: &backend-shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
              - 'libs/backend-core/**'
            frontend-shared: &frontend-shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
              - 'libs/frontend-core/**'
            "@visin/backend-core":
              - *backend-shared
            "@visin/frontend-core":
              - *frontend-shared
            auth-service:
              - *backend-shared
              - 'apps/backend/auth-service/**'
            file-service:
              - *backend-shared
              - 'apps/backend/file-service/**'
            group-service:
              - *backend-shared
              - 'apps/backend/group-service/**'
            vision-service:
              - *backend-shared
              - 'apps/backend/vision-service/**'
            account-front:
              - *frontend-shared
              - 'apps/frontend/account-front/**'
            auth-front:
              - *frontend-shared
              - 'apps/frontend/auth-front/**'
            landing-front:
              - *shared
              - 'apps/frontend/landing-front/**'
            vision-front:
              - *frontend-shared
              - 'apps/frontend/vision-front/**'

      - name: Build workspace matrix
        id: set-matrix
        run: echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "shared" and . != "backend-shared" and . != "frontend-shared"))')" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=${{ matrix.workspace }}

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

  test:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage --workspace=${{ matrix.workspace }}

      - name: Sanitize workspace name for artifact
        id: safe-name
        if: always()
        run: echo "name=$(printf '%s' '${{ matrix.workspace }}' | tr -c '[:alnum:]-' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.safe-name.outputs.name }}
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore
