name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workspaces: ${{ steps.set-matrix.outputs.workspaces }}
      workspaces-single-shard: ${{ steps.set-matrix-single-shard.outputs.workspaces }}
      e2e-workspaces: ${{ steps.set-e2e-matrix.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed workspaces
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
            backend-shared: &backend-shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
              - 'libs/backend-core/**'
            frontend-shared: &frontend-shared
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
              - 'libs/frontend-core/**'
            "@visin/backend-core":
              - *backend-shared
            "@visin/frontend-core":
              - *frontend-shared
            auth-service:
              - *backend-shared
              - 'apps/backend/auth-service/**'
            file-service:
              - *backend-shared
              - 'apps/backend/file-service/**'
            group-service:
              - *backend-shared
              - 'apps/backend/group-service/**'
            label-service:
              - *backend-shared
              - 'apps/backend/label-service/**'
            mcp-service:
              - *backend-shared
              - 'apps/backend/mcp-service/**'
            vision-service:
              - *backend-shared
              - 'apps/backend/vision-service/**'
            account-front:
              - *frontend-shared
              - 'apps/frontend/account-front/**'
            auth-front:
              - *frontend-shared
              - 'apps/frontend/auth-front/**'
            label-front:
              - *frontend-shared
              - 'apps/frontend/label-front/**'
            landing-front:
              - *shared
              - 'apps/frontend/landing-front/**'
            vision-front:
              - *frontend-shared
              - 'apps/frontend/vision-front/**'

      - name: Build workspace matrix
        id: set-matrix
        run: echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "shared" and . != "backend-shared" and . != "frontend-shared"))')" >> "$GITHUB_OUTPUT"

      # vision-front has ~180 test files and is CI-CPU-bound (GitHub-hosted runners default
      # Vitest's worker count to `cpus - 1`, i.e. 1 worker on a 2-vCPU runner, so it runs
      # effectively single-threaded). It's sharded into parallel jobs below instead of running
      # in the single-shard `test` job that covers every other workspace.
      - name: Build single-shard workspace matrix (excludes vision-front)
        id: set-matrix-single-shard
        run: echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c 'map(select(. != "shared" and . != "backend-shared" and . != "frontend-shared" and . != "vision-front"))')" >> "$GITHUB_OUTPUT"

      - name: Build e2e workspace matrix
        id: set-e2e-matrix
        run: echo "workspaces=$(echo '${{ steps.filter.outputs.changes }}' | jq -c '[.[] | select(IN("account-front","auth-front","label-front","landing-front","vision-front"))]')" >> "$GITHUB_OUTPUT"

  # Deployed images install the libs from npm, so a consumer left on an older
  # pinned version silently compiles against stale typings inside Docker's
  # cached npm-install layer. Catch that drift here, not in a failed deploy.
  lib-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Check workspaces pin the current lib versions
        run: npm run sync:libs:check

  lint:
    needs: changes
    if: needs.changes.outputs.workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: |
          npm run build --workspace=@visin/backend-core
          npm run build --workspace=@visin/frontend-core

      - name: Lint
        run: npm run lint --workspace=${{ matrix.workspace }}

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

  test:
    needs: changes
    if: needs.changes.outputs.workspaces-single-shard != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.workspaces-single-shard) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: |
          npm run build --workspace=@visin/backend-core
          npm run build --workspace=@visin/frontend-core

      - name: Run tests with coverage
        run: npm run test:coverage --workspace=${{ matrix.workspace }}

      - name: Sanitize workspace name for artifact
        id: safe-name
        if: always()
        run: echo "name=$(printf '%s' '${{ matrix.workspace }}' | tr -c '[:alnum:]-' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ steps.safe-name.outputs.name }}
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore

  test-vision-front:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.workspaces), 'vision-front')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: npm run build --workspace=@visin/frontend-core

      - name: Run test shard ${{ matrix.shard }}/4
        working-directory: apps/frontend/vision-front
        run: npx vitest run --coverage --reporter=blob --shard=${{ matrix.shard }}/4 --no-coverage.thresholds

      - name: Upload blob report
        uses: actions/upload-artifact@v4
        with:
          name: vision-front-blob-report-${{ matrix.shard }}
          path: apps/frontend/vision-front/.vitest-reports
          include-hidden-files: true

  test-vision-front-merge:
    needs: test-vision-front
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vision-front-blob-report-*
          path: apps/frontend/vision-front/.vitest-reports
          merge-multiple: true

      - name: Merge shard reports and check coverage thresholds
        working-directory: apps/frontend/vision-front
        run: npm run test:coverage:merge

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-vision-front
          path: apps/frontend/vision-front/coverage/lcov.info
          if-no-files-found: ignore

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e-workspaces != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.changes.outputs.e2e-workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared libraries
        run: |
          npm run build --workspace=@visin/backend-core
          npm run build --workspace=@visin/frontend-core

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e --workspace=${{ matrix.workspace }}

      - name: Sanitize workspace name for artifact
        id: safe-name
        if: always()
        run: echo "name=$(printf '%s' '${{ matrix.workspace }}' | tr -c '[:alnum:]-' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.safe-name.outputs.name }}
          path: apps/frontend/${{ matrix.workspace }}/playwright-report
          if-no-files-found: ignore
