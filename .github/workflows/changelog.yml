# Cuts a release: bumps the version, writes the changelog entry, tags it.
#
# Run deliberately, not on every push. Firing on push made the version a count
# of commits rather than a statement about the software — every merge produced a
# patch bump, a bot commit and a tag, so the history carried a release for each
# change and the number said nothing about what had actually changed. It also
# raced: a push landing while this ran was rejected until its author pulled the
# bot's commit, and the tag it wanted could already exist (hence the delete step
# below).
#
# The tag this creates is what triggers the image build, so cutting a release
# and publishing images are one action.

name: Conventional Changelog & Tag

on:
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Explicit version (e.g. 1.0.0). Leave empty for a patch bump.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config --global user.name "Visinbot"
          git config --global user.email "bot@visin.eu"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Copy .versionrc.json from .github to workflow directory
        run: |
          cp .github/.versionrc.json $GITHUB_WORKSPACE/.versionrc.json

      - name: Run standard-version
        run: |
          if [ -n "${{ inputs.release-as }}" ]; then
            npx standard-version --release-as "${{ inputs.release-as }}"
          else
            npx standard-version
          fi

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin main
          git push --tags origin
