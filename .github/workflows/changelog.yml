# Cuts a release: bumps the version, writes the changelog entry, tags it.
#
# Run deliberately, not on every push. Firing on push made the version a count
# of commits rather than a statement about the software — every merge produced a
# patch bump, a bot commit and a tag, so the history carried a release for each
# change and the number said nothing about what had actually changed.
#
# Normally run as a stage of release.yml, which publishes the images right after.
# Run on its own, the tag it pushes does not start the image build: a tag pushed
# from a workflow starts no other workflow.

name: Conventional Changelog & Tag

on:
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Explicit version (e.g. 1.1.0) or patch|minor|major. Leave empty to derive from the commits.'
        required: false
        type: string
  workflow_call:
    inputs:
      release-as:
        description: 'Explicit version (e.g. 1.1.0) or patch|minor|major. Leave empty to derive from the commits.'
        required: false
        type: string
    outputs:
      version:
        description: 'The version this run released, without the v prefix'
        value: ${{ jobs.changelog.outputs.version }}

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # The branch tip, not the commit the run was dispatched from: as a
          # stage of release.yml, the library publishes before it have committed
          # to the branch since.
          ref: ${{ github.ref_name }}

      - name: Set git user
        run: |
          git config --global user.name "Visinbot"
          git config --global user.email "bot@visin.eu"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Copy .versionrc.json from .github to workflow directory
        run: |
          cp .github/.versionrc.json $GITHUB_WORKSPACE/.versionrc.json

      - name: Run standard-version
        id: release
        env:
          RELEASE_AS: ${{ inputs.release-as }}
        run: |
          if [ -n "$RELEASE_AS" ]; then
            npx standard-version --release-as "$RELEASE_AS"
          else
            npx standard-version
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push changes and tag
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Something may land on the branch while this runs. Replay the release
          # commit on top and move the tag with it, so the tag names the commit
          # that is actually on the branch.
          if ! git push origin "HEAD:$BRANCH"; then
            git pull --rebase origin "$BRANCH"
            git tag -fa "v$VERSION" -m "chore(release): $VERSION"
            git push origin "HEAD:$BRANCH"
          fi
          git push origin "v$VERSION"
